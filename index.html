<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>セキスペ午後問題演習</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#f4f5f7;
  --card:#ffffff;
  --text:#171717;
  --muted:#6f737a;
  --line:#e4e6ea;
  --soft:#f7f8fa;
  --accent:#111111;
  --accent-soft:#eceef1;
  --success-bg:#eaf7ee;
  --success:#1d6b35;
  --warn-bg:#fff4d5;
  --warn:#785800;
  --danger-bg:#fdeceb;
  --danger:#8d2525;
  --shadow:0 10px 30px rgba(20,25,35,.07);
}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:760px;min-height:100vh;margin:auto;padding:14px 14px 30px}
.header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 14px}
.brand{display:flex;gap:11px;align-items:center}
.brandMark{width:36px;height:36px;border-radius:11px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;font-size:13px}
.title{font-size:20px;font-weight:850;letter-spacing:-.02em}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.hidden{display:none!important}
.sectionTitle{font-size:24px;font-weight:850;letter-spacing:-.03em;margin:0 0 5px}
.sectionLead{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.notice{font-size:12px;color:#705300;background:#fff7de;border:1px solid #f1dfac;border-radius:13px;padding:11px 12px;margin:15px 0}
.mock-grid{display:grid;gap:10px}
.mock{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:16px;text-align:left;box-shadow:none;transition:.15s transform,.15s box-shadow,.15s border-color
}
.mock:active{transform:scale(.99)}
.mockHead{display:flex;justify-content:space-between;gap:12px;align-items:center}
.mockName{font-size:17px;font-weight:800}.mockCount{font-size:12px;color:var(--muted);white-space:nowrap}
.mockMeta{display:flex;justify-content:space-between;margin-top:11px;font-size:12px;color:var(--muted)}
.mock .mini{margin-top:9px;height:7px;background:#eceef1;border-radius:99px;overflow:hidden}
.mock .mini i{display:block;height:100%;background:#111;border-radius:99px}
.topBack{background:transparent;border:0;color:#555;padding:4px 0 10px;font-size:14px;font-weight:700}
.progress{background:#fff;border-radius:18px;padding:13px 14px;margin-bottom:12px;box-shadow:0 4px 16px rgba(20,25,35,.05);position:sticky;top:8px;z-index:5}
.progressTop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.progressMock{font-size:13px;font-weight:800}
.progressQ{font-size:13px;font-weight:800;color:#444}
.progressSub{font-size:11px;color:var(--muted);margin-top:4px}
.bar{height:7px;background:#eceef1;border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:#111;border-radius:99px;transition:width .2s}
.cardExam{padding:21px 18px}
.qHeader{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.qBadge{display:inline-flex;align-items:center;gap:7px}
.badge{display:inline-flex;align-items:center;justify-content:center;background:#eef0f5;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:850}
.tag{color:#777;font-size:12px}
.qStatus{font-size:11px;color:#777}
.contextBlock{background:var(--soft);border:1px solid #eceef1;border-radius:17px;padding:16px}
.contextLabel{font-size:11px;font-weight:850;color:#5e636a;letter-spacing:.04em;margin-bottom:7px}
.contextText{font-size:15px;line-height:1.75;color:#42464d}
.questionDivider{height:1px;background:#e3e5e8;margin:14px 0 12px}
.question{font-size:20px;line-height:1.8;font-weight:800;margin:0;color:#111}
.source{margin-top:11px;text-align:right}
.meta{font-size:11px;color:#7b8087;line-height:1.5}
.source a{color:#315fb9;text-decoration:none;font-weight:700}
.answerArea{margin-top:16px}
.answerLabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.label{font-size:12px;color:#5f646b;font-weight:800}
.saveNote{font-size:10px;color:#8a8e94}
textarea{
  width:100%;min-height:170px;border:1px solid #d9dce1;border-radius:16px;
  padding:14px;font-size:17px;line-height:1.65;resize:none;outline:none;
  background:#fff;color:#111;transition:.15s border-color,.15s box-shadow
}
textarea:focus{border-color:#777;box-shadow:0 0 0 4px rgba(0,0,0,.06)}
.full{width:100%;margin-top:11px}
button.primary,button.secondary{
  border:0;border-radius:14px;padding:14px 15px;font-weight:800;min-height:50px
}
button.primary{background:#111;color:#fff}
button.secondary{background:#eceef1;color:#222}
.answer{
  display:none;border-top:1px solid var(--line);margin-top:19px;padding-top:17px;line-height:1.75
}
.answer.show{display:block}
.modelBox{background:#f7f7f8;border-radius:14px;padding:13px 14px;margin-top:6px}
.model{font-size:15px;margin:0}
.points{background:#f7f7f8;border-radius:14px;padding:11px 15px;margin:7px 0 0}
.points li{margin:5px 0;font-size:14px;line-height:1.55}
.lessonBox{background:#fbfbfc;border:1px solid #eceef1;border-radius:14px;padding:13px 14px;margin-top:7px;color:#42464d;font-size:14px;line-height:1.65}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.choices button{border:0;border-radius:13px;padding:12px 8px;min-height:48px;font-size:13px;font-weight:800}
.green{background:var(--success-bg);color:var(--success)}
.yellow{background:var(--warn-bg);color:var(--warn)}
.red{background:var(--danger-bg);color:var(--danger)}
.choiceSelected{outline:3px solid rgba(0,0,0,.08);outline-offset:0}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}
.nav button{width:100%;min-height:48px}
.result{text-align:center}
.resultTitle{font-size:24px;font-weight:850;margin:0}
.score{font-size:52px;font-weight:900;margin:13px 0 3px;letter-spacing:-.04em}
.resultCaption{color:var(--muted);font-size:12px}
.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.resultitem{background:var(--soft);border-radius:14px;padding:13px}
.num{font-size:22px;font-weight:850}.resultItemLabel{font-size:11px;color:#767b82;margin-top:3px}
.footerHint{text-align:center;color:#8a8e94;font-size:11px;margin-top:12px}
@media (max-width:420px){
  .app{padding:10px 10px 24px}
  .cardExam{padding:18px 15px}
  .question{font-size:19px}
  textarea{min-height:155px}
  .choices button{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="brand">
  <div class="brandMark">SC</div>
  <div><div class="title">セキスペ午後問題演習</div><div class="sub">Udemy型・1問1画面</div></div>
</div>
</header>

<section id="home">
<div class="card">
<h1>模試を選択</h1>
<p style="color:#666;margin-top:0">各模試60問。途中の答案・進捗・自己採点はこの端末に保存されます。全7模試・420問。</p>
<div class="notice">本番版：7模試×60問＝420問。問題データはIPA公式資料（問題冊子・解答例・採点講評）の照合後に確定します。</div>
<div class="mock-grid" id="mockGrid"></div>
</div>
</section>

<section id="exam" class="hidden">
<button class="back" id="backHome">← 模試一覧に戻る</button>
<div class="progress">
<div class="progressTop"><span class="progressMock" id="mockTitle">模試1</span><span class="progressQ" id="progressText">0 / 60問解答済み</span></div>
<div class="progressSub" id="progressSub">Q1 / 60</div>
<div class="bar"><i id="progressBar"></i></div>
</div>

<div class="card cardExam">
<div class="qHeader"><div class="qBadge"><span class="badge" id="qid">Q1</span><span class="tag" id="tag"></span></div><span class="qStatus" id="status">未採点</span></div>
<div class="contextBox">
<div class="contextTitle">背景</div>
<div id="background"></div>

<div class="questionBox">
<div class="questionTitle">問</div>
<div class="question" id="question"></div>
</div>
</div>
<div class="meta" id="source"></div>
<textarea id="draft" placeholder="あなたの答案を書いてください"></textarea>
<div class="save-note">入力内容は自動保存されます</div>
</div>
<button class="primary full" id="reveal">回答を見る</button>

<div class="answer" id="answer">
<div class="label">解答例</div>
<div class="modelBox"><div class="model" id="model"></div></div>
<div class="label">採点ポイント</div>
<ul class="points" id="points"></ul>
<div class="label" style="margin-top:14px">学習メモ</div>
<div class="points" id="lesson"></div>
<div class="label">自己採点</div>
<div class="choices">
<button class="green" data-score="2">🟢 正解</button>
<button class="yellow" data-score="1">🟡 惜しい</button>
<button class="red" data-score="0">🔴 不正解</button>
</div>
<button class="primary full" id="next">次の問題 →</button>
</div>

<div class="nav">
<button class="secondary" id="prev">← 前の問題</button>
<button class="secondary" id="nextTop">次の問題 →</button>
</div>
<div class="meta" id="status"></div>
</div>
</section>

<section id="result" class="hidden">
<div class="card result">
<h2 class="resultTitle" id="resultTitle">模試終了</h2>
<div class="score" id="resultPercent">0%</div>
<div class="resultCaption">自己採点結果</div>
<div class="resultgrid">
<div class="resultitem"><div class="num" id="rCorrect">0</div><div class="resultItemLabel">正解</div></div>
<div class="resultitem"><div class="num" id="rAlmost">0</div><div class="resultItemLabel">惜しい</div></div>
<div class="resultitem"><div class="num" id="rWrong">0</div><div class="resultItemLabel">不正解</div></div>
</div>
<button class="primary full" id="resumeWrong">間違えた問題を復習</button>
<button class="secondary full" id="restart">この模試を最初から</button>
<button class="secondary full" id="resultHome">模試一覧へ</button>
</div>
</section>
</div>

<script>
const questions = [{"year":"令和7春","loc":"問1 設問5(1)","q":"複数の管理対象サーバへの接続を1台の中継サーバに集約する場合、その中継役のサーバを何と呼びますか。","a":"踏み台サーバ","tag":"開発環境","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_sc_pm_ans.pdf","review":true,"id":1,"mock":1,"no":1,"points":["踏み台サーバ"],"background":"開発者は複数のサーバを管理しています。管理用の接続を1か所に集約し、各サーバへ直接アクセスさせないことで、管理アクセスの入口を限定したいと考えています。","bridge":"この状況で、開発環境について問われている対象・値・用語を特定します。","ask":"複数の管理対象サーバへの接続を1台の中継サーバに集約する場合、その中継役のサーバを何と呼びますか。","lesson":"開発環境は単語だけでなく、どの場面で使い、何を防ぐための仕組みなのかまで理解すると、午後問題で応用しやすくなります。"},{"year":"令和5春","loc":"午後II 問1 設問6(1)","q":"グループ会社のWebサイト資産を管理する方法は何か。","a":"グループ各社で資産管理システムを導入し、Webサイトの情報を管理する","tag":"資産管理","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_sc_pm2_ans.pdf","review":true,"id":2,"mock":1,"no":2,"points":["グループ各社で資産管理システムを導入し、Webサイトの情報を管理する"],"background":"企業グループでは複数の会社・Webサイト・システムが存在します。脆弱性診断やインシデント対応の対象を漏れなく把握するため、IT資産を継続的に一覧化して管理できる仕組みを整えます。","bridge":"この状況で、資産管理に対して取るべき具体的な方法・設定を判断します。","ask":"グループ会社のWebサイト資産を管理する方法は何か。","lesson":"資産管理は単語だけでなく、どの場面で使い、何を防ぐための仕組みなのかまで理解すると、午後問題で応用しやすくなります。"},{"year":"令和5春","loc":"午後II 問1 設問4(1)","q":"HTML内スクリプトからcookieへアクセスする脆弱性は何か。","a":"HTML内のスクリプトからcookieへのアクセス","tag":"XSS","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_sc_pm2_ans.pdf","review":true,"id":3,"mock":1,"no":3,"points":["HTML内のスクリプトからcookieへのアクセス"],"background":"Webアプリケーションで利用者の入力をページに表示しています。攻撃者が入力を悪用してスクリプトを実行できると、利用者のブラウザ上で意図しない処理が実行される可能性があります。","bridge":"この状況で、XSSについて問われている対象・値・用語を特定します。","ask":"HTML内スクリプトからcookieへアクセスする脆弱性は何か。","lesson":"XSSは攻撃者のスクリプトを利用者のブラウザで実行させる攻撃です。出力時のエスケープやCookieのHttpOnlyなどが重要です。"},{"year":"令和7春","loc":"問3 設問3","q":"WebViewで危険なURLを防ぐため、どのような検証を行うか。","a":"WebViewを呼び出す前に、URLの先頭がhttps://www.a-sha.co.jp/であるかを検証する","tag":"WebView","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_sc_pm_ans.pdf","review":true,"id":4,"mock":1,"no":4,"points":["WebViewを呼び出す前に、URLの先頭がhttps://www.a-sha.co.jp/であるかを検証する"],"background":"スマートフォンアプリがWebViewでWebコンテンツを表示しています。外部から受け取ったURLをそのまま表示すると、正規サイト以外へ誘導されるおそれがあるため、表示前にURLを検証します。","bridge":"この状況で、WebViewに対して取るべき具体的な方法・設定を判断します。","ask":"WebViewで危険なURLを防ぐため、どのような検証を行うか。","lesson":"WebViewは単語だけでなく、どの場面で使い、何を防ぐための仕組みなのかまで理解すると、午後問題で応用しやすくなります。"},{"year":"令和7春","loc":"問2 設問3(2)","q":"OpenSSHの認証タイムアウトが多数発生した場合、どのように通知するか。","a":"OpenSSHのログに認証タイムアウトのメッセージの出力が多数あったらサイト担当者に電子メールでアラートを送る","tag":"ログ監視","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_sc_pm_ans.pdf","review":false,"id":5,"mock":1,"no":5,"points":["OpenSSHのログに認証タイムアウトのメッセージの出力が多数あったらサイト担当者に電子メールでアラートを送る"],"background":"サーバや認証システムのログを継続的に監視し、異常な回数やパターンが発生したときに担当者へ通知します。","bridge":"この状況で、ログ監視に対して取るべき具体的な方法・設定を判断します。","ask":"OpenSSHの認証タイムアウトが多数発生した場合、どのように通知するか。","lesson":"ログ監視は単語だけでなく、どの場面で使い、何を防ぐための仕組みなのかまで理解すると、午後問題で応用しやすくなります。"},{"year":"令和7春","loc":"問1 設問2(1)","q":"外部サイトから毎回取得する方式をやめ、信頼できるJavaScriptを自社側で管理する場合、どのような配置方法を採用しますか。","a":"スクリプトPをダウンロードしておき、システムQのサーバ上に配置する方法","tag":"セキュア開発","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_sc_pm_ans.pdf","review":false,"id":6,"mock":1,"no":6,"points":["スクリプトPをダウンロードしておき、システムQのサーバ上に配置する方法"],"background":"外部企業が提供するJavaScriptをWebシステムで利用しています。提供元が侵害されると改ざんされたスクリプトが利用者へ配布される可能性があるため、依存するスクリプトの管理方法を見直します。","bridge":"この状況で、セキュア開発に対して取るべき具体的な方法・設定を判断します。","ask":"外部サイトから毎回取得する方式をやめ、信頼できるJavaScriptを自社側で管理する場合、どのような配置方法を採用しますか。","lesson":"セキュア開発は単語だけでなく、どの場面で使い、何を防ぐための仕組みなのかまで理解すると、午後問題で応用しやすくなります。"},{"year":"令和6春","loc":"問1 設問3(2)","q":"Webサーバのレスポンスヘッダーで、セキュリティ対策の設定状況を確認するとき、どのHTTPヘッダーを確認しますか。","a":"Header","tag":"Web","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_sc_pm_ans.pdf","review":true,"id":7,"mock":1,"no":7,"points":["Header"],"background":"Webサイトのセキュリティ診断を行っています。HTTPレスポンスに設定できるセキュリティ関連ヘッダーを確認し、ブラウザ側の防御設定に漏れがないか調べます。","bridge":"この状況で、Webについて問われている対象・値・用語を特定します。","ask":"Webサーバのレスポンスヘッダーで、セキュリティ対策の設定 ","review":false,"id":418,"mock":7,"no":58,"points":["クライアント認証を行う"],"background":"利用者が誰であるかを確認する認証処理を設計しています。パスワードや証明書などの認証要素を適切に扱い、なりすましを防ぎます。","bridge":"この状況で、認証について問われている対象・値・用語を特定します。","ask":"この場面で必要な認証方式は何か。","lesson":"認証は単語だけでなく、どの場面で使い、何を防ぐための仕組みなのかまで理解すると、午後問題で応用しやすくなります。"},{"year":"令和7秋","loc":"問4 設問4(1)","q":"バックアップからSCADAへ復元する手順として何を整備するか。","a":"SCADAにNCプログラムをリストアする手順","tag":"制御システム","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_sc_pm_ans.pdf","review":false,"id":419,"mock":7,"no":59,"points":["SCADAにNCプログラムをリストアする手順"],"background":"工場の制御システムでは、業務用ITとは異なる可用性・安全性の要件があります。障害や感染が起きても操業への影響を抑えられるよう、安全な復旧手順を事前に整備します。","bridge":"この状況で、制御システムについて問われている対象・値・用語を特定します。","ask":"バックアップからSCADAへ復元する手順として何を整備するか。","lesson":"制御システムは単語だけでなく、どの場面で使い、何を防ぐための仕組みなのかまで理解すると、午後問題で応用しやすくなります。"},{"year":"令和6秋","loc":"問4 設問2","q":"攻撃者メールアドレスを利用した企業情報変更の例は何か。","a":"会社名に攻撃者のメールアドレスへ変更した文字列を入力して変更する","tag":"WebAPI","source":"https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_sc_pm_ans.pdf","review":true,"id":420,"mock":7,"no":60,"points":["会社名に攻撃者のメールアドレスへ変更した文字列を入力して変更する"],"background":"Web APIから取得できる情報の範囲を検討しています。利用者の属性情報を必要以上に返すと、侵害時の情報漏えい範囲まで広がるため、返却データを最小化します。","bridge":"この状況で、WebAPIについて問われている対象・値・用語を特定します。","ask":"攻撃者メールアドレスを利用した企業情報変更の例は何か。","lesson":"WebAPIは単語だけでなく、どの場面で使い、何を防ぐための仕組みなのかまで理解すると、午後問題で応用しやすくなります。"}];
const STORAGE="sekispe_udemy_v1";
let data=JSON.parse(localStorage.getItem(STORAGE)||'{"mocks":{},"lastMock":1}');
let mock=1,index=0,reviewOnly=false;

const $=id=>document.getElementById(id);
function save(){localStorage.setItem(STORAGE,JSON.stringify(data))}
function mockState(m){
 if(!data.mocks[m]) data.mocks[m]={current:0,answers:{},scores:{}};
 return data.mocks[m];
}
function listQuestions(m){
 return questions.filter(q=>q.mock===m && (!reviewOnly || mockState(m).scores[q.no]!==2));
}
function renderMocks(){
 const g=$("mockGrid");g.innerHTML="";
 for(let m=1;m<=7;m++){
  const s=mockState(m), answered=Object.keys(s.scores).length, pct=Math.round(answered/60*100);
  const b=document.createElement("button");b.className="mock";
  b.innerHTML=`<div class="mockHead"><span class="mockName">模試 ${m}</span><span class="mockCount">${answered} / 60問</span></div><div class="mockMeta"><span>${answered===0?"未開始":answered===60?"完了":"進行中"}</span><span>${pct}%</span></div><div class="mini"><i style="width:${pct}%"></i></div>`;
  b.onclick=()=>startMock(m,false);g.appendChild(b);
 }
 save();
}
function startMock(m,review){
 mock=m;reviewOnly=review;
 const s=mockState(m);
 const qs=listQuestions(m);
 index=review?0:Math.min(s.current,Math.max(qs.length-1,0));
 $("home").classList.add("hidden");$("result").classList.add("hidden");$("exam").classList.remove("hidden");
 render();
}
function render(){
 const qs=listQuestions(mock);
 if(!qs.length){finish();return}
 const x=qs[index],s=mockState(mock), ans=s.answers[x.no]||"", score=s.scores[x.no];
 const answeredCount=Object.keys(s.scores).length;
 $("mockTitle").textContent=`模試 ${mock}${reviewOnly?"・復習":""}`;
 $("progressText").textContent=`${answeredCount} / 60問解答済み`;
 $("progressSub").textContent=`Q${x.no} / 60`;
 $("progressBar").style.width=(answeredCount/60*100)+"%";
 $("qid").textContent=`Q${x.no}`;$("tag").textContent=x.tag;
 $("background").textContent=x.background;
 $("bridge").textContent=x.bridge;
 $("question").textContent=x.ask;
 $("source").innerHTML=`${x.year} / ${x.loc}${x.review?"・再演習":""}<br><a href="${x.source}" target="_blank" rel="noopener">IPA公式 解答例を開く</a>`;
 $("draft").value=ans;
 $("model").textContent=x.a;
 $("points").innerHTML=x.points.map(p=>`<li>${p}</li>`).join("");
 $("lesson").textContent=x.lesson;
 $("answer").classList.remove("show");
 $("status").textContent=score===undefined?"未採点":score===2?"🟢 正解":score===1?"🟡 惜しい":"🔴 不正解";
}
$("draft").addEventListener("input",e=>{
 const s=mockState(mock),qs=listQuestions(mock),x=qs[index];s.answers[x.no]=e.target.value;s.current=x.no;data.lastMock=mock;save();
});
$("reveal").onclick=()=>{$("answer").classList.add("show");window.scrollTo({top:0,behavior:"smooth"})};
document.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{
 const qs=listQuestions(mock),x=qs[index];mockState(mock).scores[x.no]=Number(b.dataset.score);save();render();$("answer").classList.add("show");
});
function next(){
 const qs=listQuestions(mock);
 if(index<qs.length-1){index++;mockState(mock).current=qs[index].no;save();render();window.scrollTo({top:0,behavior:"smooth"})}
 else if(reviewOnly) finish();
 else finish();
}
function prev(){if(index>0){index--;render();window.scrollTo({top:0,behavior:"smooth"})}}
$("next").onclick=next;$("nextTop").onclick=next;$("prev").onclick=prev;
$("backHome").onclick=()=>{renderMocks();$("exam").classList.add("hidden");$("home").classList.remove("hidden")};
function finish(){
 const s=mockState(mock);let c=0,a=0,w=0;
 for(let n=1;n<=60;n++){if(s.scores[n]===2)c++;else if(s.scores[n]===1)a++;else if(s.scores[n]===0)w++}
 $("exam").classList.add("hidden");$("result").classList.remove("hidden");
 $("resultTitle").textContent=`模試 ${mock} 終了`;
 $("resultPercent").textContent=Math.round(c/60*100)+"%";
 $("rCorrect").textContent=c;$("rAlmost").textContent=a;$("rWrong").textContent=w;
}
$("resumeWrong").onclick=()=>startMock(mock,true);
$("restart").onclick=()=>{
 data.mocks[mock]={current:0,answers:{},scores:{}};save();startMock(mock,false)
};
$("resultHome").onclick=()=>{$("result").classList.add("hidden");$("home").classList.remove("hidden");renderMocks()};
renderMocks();
</script>
