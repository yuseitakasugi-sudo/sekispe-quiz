<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>セキスペ午後問題演習・データ再構築版</title><style>
:root{--bg:#f3f4f6;--card:#fff;--text:#15171a;--muted:#6d7279;--line:#e4e7eb;--soft:#f7f8fa;--black:#111;--ok:#17642f;--okbg:#e8f6ec;--mid:#765900;--midbg:#fff3cf;--ng:#8a2525;--ngbg:#fde9e8}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif}
button,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:760px;min-height:100vh;margin:auto;padding:8px 10px 30px}
.header{display:flex;justify-content:space-between;align-items:center;padding:7px 2px 10px;position:sticky;top:0;z-index:20;background:rgba(243,244,246,.95);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px}.mark{width:36px;height:36px;border-radius:11px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px}.title{font-size:19px;font-weight:900}.sub{font-size:10px;color:#777;margin-top:2px}
.icon{width:38px;height:38px;border:0;background:#e9ebee;border-radius:12px;font-size:18px}.card{background:#fff;border-radius:22px;padding:19px;box-shadow:0 8px 28px rgba(18,24,32,.065)}
h1,h2{margin:0}.lead{color:var(--muted);font-size:13px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:var(--soft);border-radius:15px;padding:12px 6px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:#7a7f86}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left}.tab.active{background:#111;color:#fff;border-color:#111}.tab b{display:block;font-size:14px}.tab small{display:block;margin-top:4px;opacity:.7}
.filters{display:flex;gap:7px;overflow:auto;margin:12px 0}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:11px;white-space:nowrap}.pill.active{background:#111;color:#fff;border-color:#111}
.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;text-align:left;width:100%}.itemTop{display:flex;justify-content:space-between;gap:8px}.item b{font-size:14px}.meta{font-size:10px;color:#777;margin-top:5px;line-height:1.5}
.hidden{display:none!important}.back{border:0;background:transparent;padding:2px 0 9px;color:#555;font-weight:800}.progress{background:#fff;border-radius:17px;padding:12px 14px;margin-bottom:10px;box-shadow:0 5px 18px rgba(15,20,28,.055)}.pTop{display:flex;justify-content:space-between;font-size:12px;font-weight:900}.pSub{font-size:10px;color:#777;margin-top:3px}.bar{height:7px;background:#eceef1;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:#111}
.qhead{display:flex;justify-content:space-between;align-items:center}.badge{background:#eef0f4;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.tag{font-size:11px;color:#777;margin-left:6px}.context{background:var(--soft);border:1px solid #e7e9ed;border-radius:17px;padding:16px;margin:14px 0}.label{font-size:12px;font-weight:900;color:#5e6369}.ctxText{font-size:15px;line-height:1.8;margin-top:7px}.divider{height:1px;background:#e1e3e7;margin:14px 0 12px}.question{font-size:19px;line-height:1.8;font-weight:850;margin-top:7px}.answerArea{margin-top:10px}.answerArea textarea{width:100%;min-height:150px;border:1px solid #d9dce1;border-radius:16px;padding:14px;font-size:16px;line-height:1.6;resize:vertical}.choices{display:grid;gap:8px;margin-top:8px}.choice{border:1px solid #dfe2e6;background:#fff;border-radius:14px;padding:13px;text-align:left;font-size:14px;font-weight:800}.choice.sel{background:#f1f2f4;border-color:#111}.choice.correct{background:#e8f6ec;border-color:#17642f;color:#17642f}.choice.wrong{background:#fde9e8;border-color:#8a2525;color:#8a2525}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.primary,.secondary{border:0;border-radius:14px;min-height:50px;padding:13px;font-weight:900}.primary{background:#111;color:#fff}.secondary{background:#eaecf0;color:#222}.answer{display:none;border-top:1px solid var(--line);margin-top:17px;padding-top:16px}.answer.show{display:block}.model{background:var(--soft);border-radius:14px;padding:13px 14px;font-size:15px;line-height:1.7;margin-top:7px}.lesson{background:#fbfbfc;border:1px solid #eceef1;border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.7;margin-top:8px}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.score button{border:0;border-radius:13px;padding:12px;font-weight:900}.ok{background:var(--okbg);color:var(--ok)}.mid{background:var(--midbg);color:var(--mid)}.ng{background:var(--ngbg);color:var(--ng)}
.notice{background:#fff7dd;border:1px solid #f0dc9b;color:#6c5200;border-radius:14px;padding:12px;font-size:11px;line-height:1.6;margin-top:12px}
</style></head>
<body><div class="app"><header class="header"><div class="brand"><div class="mark">SC</div><div><div class="title">セキスペ午後問題演習</div><div class="sub">過去問と類題を完全分離・答案自動保存</div></div></div><button class="icon" id="homeBtn">⌂</button></header>
<section id="home"><div class="card"><h1>問題を選択</h1><p class="lead">UIだけを旧ファイルから踏襲し、問題データは旧HTMLから再利用せず、今回確認したIPA公式資料を基準に再構築しています。</p>
<div class="stats"><div class="stat"><b id="countPast">0</b><span>検証済み過去問</span></div><div class="stat"><b id="countVar">0</b><span>新規類題</span></div><div class="stat"><b>60</b><span>類題模試</span></div></div>
<div class="tabs"><button class="tab active" onclick="setBank('past')"><b>過去問問題集</b><small>原典の論点・回答形式を維持</small></button><button class="tab" onclick="setBank('variant')"><b>類題模試</b><small>完全新規シナリオ・設問</small></button></div>
<div id="filters" class="filters"></div><div id="list" class="list"></div>
<div class="notice"><b>データ監査方針</b><br>旧HTMLに入っていた問題文・模範解答・類題データは再利用していません。過去問はIPA公式の問題冊子・解答例を根拠に再構成し、確認できないものは推測で補完しません。</div></div></section>
<section id="exam" class="hidden"><button class="back" id="back">← 問題一覧</button><div class="progress"><div class="pTop"><span id="titleExam">過去問</span><span id="pText"></span></div><div class="pSub">1問1画面</div><div class="bar"><i id="bar" style="width:0%"></i></div></div>
<div class="card"><div class="qhead"><div><span class="badge" id="qid">Q1</span><span class="tag" id="tag"></span></div><span class="tag">答案は自動保存</span></div>
<div class="context"><div class="label">＜背景＞</div><div class="ctxText" id="background"></div><div class="divider"></div><div class="label">＜問＞</div><div class="question" id="question"></div></div>
<div class="label">あなたの答案</div><div class="answerArea"><textarea id="draft" placeholder="ここに答案を書いてください"></textarea><div id="choices" class="choices"></div></div>
<button class="primary" style="width:100%;margin-top:10px" id="reveal">回答を見る</button>
<div class="answer" id="answer"><div class="label">模範解答・正答</div><div class="model" id="model"></div><div class="label" style="margin-top:13px">学習ポイント</div><div class="lesson" id="lesson"></div><div class="label" style="margin-top:13px">自己採点</div><div class="score"><button class="ok" data-s="2">🟢 正解</button><button class="mid" data-s="1">🟡 惜しい</button><button class="ng" data-s="0">🔴 不正解</button></div></div>
<div class="actions"><button class="secondary" id="prev">← 前の問題</button><button class="primary" id="next">次の問題 →</button></div></div></section></div>
<script>
const DB = {"past": [{"year": "令和7秋", "src": "問1 設問1", "tag": "CSP", "type": "choice", "q": "CSPの設定によって、外部リソースの読込みを制御する際、攻撃成立を防ぐために重要な考え方はどれか。", "choices": ["許可するリソースの出所を限定する", "全ての外部リソースを無条件に許可する", "Cookieだけを暗号化する", "HTTPだけを利用する"], "a": "許可するリソースの出所を限定する", "lesson": "CSPはブラウザが読み込めるリソースの範囲を制御し、XSSなどの影響を低減する。", "background": "Webアプリケーションで利用者入力を起点とするスクリプト実行が問題となった。原因を分析したところ、ブラウザ側で読み込むリソースの制御が十分でなかった。そこで、スクリプトの実行条件を制限する対策を検討した。"}, {"year": "令和7秋", "src": "問1 設問2(1)", "tag": "Webアプリ", "type": "text", "q": "利用者が登録したファイルについて、拡張子だけを信頼することが危険なのはなぜか。理由を一つ答えよ。", "a": "拡張子と実際のファイル形式が一致しないファイルをアップロードできる可能性があるため。", "lesson": "ファイルアップロードでは拡張子、MIME、実体など複数の観点で検証する。", "background": "業務用Webサービスにファイルアップロード機能が追加された。攻撃者が細工したファイルを登録できる可能性が判明したため、アップロード処理の検証方法を見直すことになった。"}, {"year": "令和7秋", "src": "問1 設問3(3)", "tag": "XSS", "type": "text", "q": "Webページに利用者入力を表示する際、スクリプト実行を防ぐために行うべき処理を答えよ。", "a": "出力時にエスケープ処理を施す。", "lesson": "XSS対策では、HTMLとして解釈される文脈に応じた適切なエスケープが基本となる。", "background": "レビューの結果、利用者が入力した文字列が別の利用者のブラウザに表示される処理に問題が見つかった。入力値がHTMLとして解釈される可能性があるため、表示処理を修正することになった。"}, {"year": "令和7秋", "src": "問2 設問1", "tag": "暗号", "type": "multi", "q": "署名鍵を推測するサイドチャネル攻撃として適切な観測方法を二つ挙げよ。", "choices": ["機器の作動音を観測する", "放出される電磁波を観測する", "画面の解像度を変える", "利用者のメール本文を解析する"], "a": ["機器の作動音を観測する", "放出される電磁波を観測する"], "lesson": "サイドチャネル攻撃は、暗号処理そのものではなく処理に伴う物理的な情報を利用する。", "background": "鍵管理用PCで重要な署名鍵を扱っている。施設外から鍵を直接取得することは難しいが、装置から漏れる物理的情報を観測できる可能性が指摘された。"}, {"year": "令和7秋", "src": "問2 設問3(3)", "tag": "鍵管理", "type": "text", "q": "署名鍵の取扱いを一人の担当者だけに任せる運用を改める場合、どのような手順に変更すべきか。", "a": "複数名で互いに確認しながら作業を実施する。", "lesson": "重要鍵の操作では職務分離・相互確認によって単独操作のリスクを下げる。", "background": "暗号資産を扱うシステムで署名鍵を運用している。鍵の移送や利用を一人の担当者だけで実施しており、内部不正や操作ミスのリスクが問題になった。"}, {"year": "令和7秋", "src": "問2 設問4(1)", "tag": "鍵管理", "type": "text", "q": "パスワードで暗号化した署名鍵と、その復号に必要なパスワードを同時に移送することが危険な理由を答えよ。", "a": "鍵と復号情報を同時に取得されると、暗号化による保護が実質的に失われるため。", "lesson": "秘密情報と復号情報は同じ経路・媒体で管理しないことが重要。", "background": "署名鍵を安全な場所へ移送する手順を確認したところ、暗号化した鍵とパスワードを同時に持ち運んでいた。盗難時のリスクを再評価することになった。"}, {"year": "令和7秋", "src": "問3 設問1", "tag": "DNSSEC", "type": "text", "q": "DNS応答の改ざんを防ぐために利用できる仕組みを答えよ。", "a": "DNSSEC", "lesson": "DNSSECはDNSデータの真正性・完全性を検証するための仕組みである。", "background": "リモートワーク環境で名前解決の安全性を確認していたところ、DNS応答の改ざんによって偽サイトへ誘導されるリスクが指摘された。"}, {"year": "令和7秋", "src": "問3 設問1(2)", "tag": "DoH/TLS", "type": "multi", "q": "DNS over HTTPSの通信を保護する暗号プロトコルを答えよ。", "choices": ["TLS", "FTP", "ARP", "ICMP"], "a": ["TLS"], "lesson": "DoHはHTTPS上でDNS問い合わせを行うため、HTTPSの通信保護にはTLSが使われる。", "background": "社外からDNS問い合わせを行う端末について、通信内容を第三者に盗聴されるリスクを低減したい。HTTPSを利用するDNS方式の仕組みを確認した。"}, {"year": "令和7秋", "src": "問3 設問3", "tag": "アクセス制御", "type": "text", "q": "管理用設定サイトへのアクセス元を限定する場合、どのような制御を行うべきか。", "a": "アクセスを許可する接続元IPアドレスを管理端末の固定グローバルIPアドレスに限定する。", "lesson": "管理画面は到達元を限定し、認証だけに依存しない多層防御を行う。", "background": "VPNサービスの設定サイトがインターネットから到達可能になっている。認証突破時の被害を抑えるため、設定サイトへの到達元そのものを制限することになった。"}, {"year": "令和7秋", "src": "問3 設問5(1)", "tag": "MFA", "type": "text", "q": "認証方式に個人所有スマートフォンの電話番号を登録することが問題となる理由を答えよ。", "a": "会社が管理できない個人端末に依存するため。", "lesson": "認証要素は業務システムの管理範囲と退職・紛失時の運用を考慮する。", "background": "会社のVPNで多要素認証を導入している。登録情報を確認したところ、個人所有スマートフォンの番号が登録されている利用者がいたため、管理上のリスクを検討した。"}, {"year": "令和7秋", "src": "問4 設問1", "tag": "マルウェア", "type": "choice", "q": "パターンマッチング型のマルウェア検知が特に苦手とする対象はどれか。", "choices": ["未知のマルウェア", "既知のマルウェア", "既知のハッシュ値", "既知のシグネチャ"], "a": "未知のマルウェア", "lesson": "シグネチャ依存型の検知は未知の攻撃に弱いため、振る舞い検知などと組み合わせる。", "background": "メールSaaSのマルウェア対策を見直している。既知の脅威は検知できている一方、新しいマルウェアが検査をすり抜ける可能性が課題になった。"}, {"year": "令和7秋", "src": "問4 設問1(2)", "tag": "暗号化", "type": "text", "q": "メール添付ファイルが暗号化されている場合、マルウェア検査が困難になる理由を答えよ。", "a": "暗号化されたファイルの中身を検査できないため。", "lesson": "検査対象の内容を復号できなければ、ファイル内部の悪性コードを判定できない。", "background": "メールの添付ファイル検査を強化している。暗号化された添付ファイルについては検査が十分に行えないケースがあることが分かった。"}, {"year": "令和7秋", "src": "問4 設問4(1)", "tag": "復旧", "type": "text", "q": "製造設備のSCADAが使用不能になった場合に備え、NCプログラムを復旧するために必要な仕組みを答えよ。", "a": "SCADA内のNCプログラムをバックアップ／リストアするための媒体とソフトウェア。", "lesson": "OTの復旧計画では、システム再構築だけでなく業務データ・制御データの復元まで具体化する。", "background": "製造現場ではSCADAが工作機械を制御している。マルウェア感染による停止を想定すると、SCADAを復旧してもNCプログラムが戻らなければ製造を再開できない。"}, {"year": "令和7秋", "src": "問4 設問4(2)", "tag": "OTネットワーク", "type": "text", "q": "SCADAと工作機械間の通信が大量の妨害パケットで阻害される攻撃シナリオを、因果関係が分かるように説明せよ。", "a": "マルウェアに感染した一般PCが妨害パケットを大量送信し、SCADAと工作機械間の通信を妨害する。", "lesson": "攻撃シナリオは「侵入元→攻撃行動→影響」の順に書くと答案にしやすい。", "background": "製造ネットワークと一般PCが同じ企業ネットワークに接続されている。一般PCが感染した場合、製造設備の通信へ影響する可能性があるため、攻撃経路を想定した。"}, {"year": "令和6秋", "src": "問1 設問1(1)", "tag": "インシデント対応", "type": "text", "q": "ログ分析から感染拡大先の端末を特定する場合、接続成功の記録から何を特定するか。", "a": "感染した端末から接続された端末を特定する。", "lesson": "大量の失敗ログの中から成功ログを抽出し、攻撃者の横展開を追跡する。", "background": "社内仮想PCでマルウェア感染が発生した。認証ログには多数の失敗と少数の成功が記録されており、感染拡大範囲を特定する必要がある。"}, {"year": "令和6秋", "src": "問1 設問1(2)", "tag": "ログ分析", "type": "text", "q": "感染端末から参照されたファイルサーバを特定するため、どのサーバをログから確認するか。", "a": "filesv", "lesson": "被害範囲を把握するには、端末ログだけでなくファイルサーバ側のアクセス履歴も確認する。", "background": "感染端末から社内ファイルへアクセスされた可能性がある。情報漏えい範囲を把握するため、サーバ側のアクセス記録を分析することになった。"}, {"year": "令和6秋", "src": "問1 設問1(3)", "tag": "アカウント侵害", "type": "text", "q": "不正アクセスに利用されたドメインユーザをログから特定せよ。", "a": "ad01\\user019", "lesson": "認証ログから利用されたアカウントを特定し、封じ込めとして無効化する。", "background": "攻撃者が正規アカウントを悪用して社内端末へ横展開した疑いがある。認証ログを確認し、悪用されたアカウントを特定することになった。"}, {"year": "令和6秋", "src": "問1 設問2", "tag": "横展開", "type": "text", "q": "RDP等の認証ログで、総当たり攻撃の兆候を監視する場合に着目すべき事象を答えよ。", "a": "同一アカウントによる認証失敗が多数発生した後に成功するなど、連続した認証失敗と成功の組合せ。", "lesson": "ブルートフォースは失敗回数だけでなく、その後の成功や接続先との関係まで見る。", "background": "感染端末から複数端末への認証試行が確認された。失敗が多数続く一方、途中に成功記録も存在するため、攻撃パターンを分析することになった。"}, {"year": "令和5春", "src": "午後I 問1 設問1(3)", "tag": "SQLインジェクション", "type": "text", "q": "JavaのDBアクセス処理でSQLインジェクションを防ぐため、入力値をSQL文へ直接連結しない方法を答えよ。", "a": "PreparedStatementを利用してパラメータ化する。", "lesson": "SQLインジェクション対策ではプレースホルダを利用したパラメータ化が基本。", "background": "Javaで受注情報を検索するWebアプリケーションを開発している。静的解析でSQL文の組立て方に問題が見つかり、利用者入力によるSQLインジェクションの可能性が指摘された。"}, {"year": "令和5春", "src": "午後I 問2", "tag": "セッション", "type": "text", "q": "WebアプリケーションでセッションIDを利用する場合、攻撃者に推測・固定化されることを防ぐために重要な点を答えよ。", "a": "十分な長さと予測困難性を持つセッションIDを利用し、認証時に再生成する。", "lesson": "セッション管理では推測耐性に加え、セッション固定化への対策も重要。", "background": "会員向けWebサービスの認証機能を点検している。認証前後で同じセッションIDが利用される構成について、セッション固定化攻撃のリスクが指摘された。"}, {"year": "令和5春", "src": "午後II 問1 設問1", "tag": "脆弱性診断", "type": "text", "q": "脆弱性診断の対象Webサイトについて、設計上の仕様を確認するために行うべきことを答えよ。", "a": "診断対象のWebサイトの設計書を確認する。", "lesson": "自動診断だけでは仕様依存の問題を把握しにくいため、設計・仕様を確認する。", "background": "企業グループ内のWebサイトを自社で診断することになった。ツールだけでは診断対象の仕様を十分に把握できないため、診断前の情報収集方法を検討した。"}, {"year": "令和5秋", "src": "問1 設問1(2)", "tag": "XSS", "type": "text", "q": "レビュータイトルをHTMLとして出力する際、XSSを防ぐために必要な処理を答えよ。", "a": "レビュータイトルを出力する前にエスケープ処理を施す。", "lesson": "利用者入力をHTMLへ出力する際は、HTMLコンテキストに応じてエスケープする。", "background": "レビュー機能を持つWebアプリケーションで、利用者が投稿したタイトルがそのまま画面に表示されていた。細工した投稿によるスクリプト実行を防ぐ対策を検討した。"}, {"year": "令和4秋", "src": "午後II 問1 設問1(2)", "tag": "ARPスプーフィング", "type": "text", "q": "ARPスプーフィングが発生した場合、ARPテーブルにどのような異常が現れるか。", "a": "同一MACアドレスのエントリが複数存在するなど、IPアドレスとMACアドレスの対応が不自然になる。", "lesson": "ARPスプーフィングではARPキャッシュの対応関係が攻撃者に書き換えられる。", "background": "脅威情報調査用のネットワークで通信の異常が確認された。ARPテーブルを調べたところ、同じMACアドレスに複数のIPアドレスが対応する状態が確認された。"}, {"year": "令和4秋", "src": "午後II 問1 設問4(1)", "tag": "パスワード", "type": "text", "q": "パスワードを保存する場合、単純な暗号化ではなくハッシュ化を利用する理由を答えよ。", "a": "復号可能な形で保存せず、元のパスワードを直接復元できない形で検証できるため。", "lesson": "パスワード保存では適切なソルト付きハッシュと十分な計算コストを持つ方式を利用する。", "background": "認証システムのパスワード保存方式を点検している。データベースが漏えいした場合でも、元のパスワードを容易に復元されない方式へ変更することになった。"}, {"year": "令和4秋", "src": "午後II 問1 設問4(2)", "tag": "アカウントロック", "type": "text", "q": "オンライン総当たり攻撃を抑止するため、認証失敗が連続した場合にどのような制御を行うか。", "a": "一定回数連続して認証に失敗した利用者IDをロックする。", "lesson": "アカウントロック、レート制限、MFAなどを組み合わせてオンライン攻撃を抑える。", "background": "外部公開サービスで認証試行の急増が確認された。パスワード総当たりを想定し、認証処理側で試行回数を制限することになった。"}, {"year": "令和4秋", "src": "午後II 問1 設問5(2)", "tag": "ログ", "type": "text", "q": "デバッグログに認証情報を出力しないことが必要な理由を答えよ。", "a": "ログを閲覧できる者に認証情報を取得されるおそれがあるため。", "lesson": "ログは機密情報を含み得るため、認証情報や秘密鍵などを出力しない。", "background": "開発環境のデバッグログを本番環境でも保存していた。ログを分析したところ認証関連の情報が記録される可能性があり、ログ出力方針を見直すことになった。"}, {"year": "令和3春", "src": "午後II 問1 設問1(1)", "tag": "パスワードスプレー", "type": "text", "q": "外部から入手したIDとパスワードの組を用いてログインを試行する攻撃を何というか。", "a": "外部から入手した認証情報を使った不正ログイン攻撃（パスワードリスト攻撃）。", "lesson": "漏えい済み認証情報の使い回しを狙う攻撃と、総当たり攻撃を区別する。", "background": "会員サービスで不正ログインが増加した。調査すると、他サービスから流出したとみられる認証情報が大量に試行されていた。"}, {"year": "令和3春", "src": "午後II 問1 設問2", "tag": "USB", "type": "text", "q": "マルウェア感染したUSBメモリを起点として、管理用PCから店舗管理サーバへ侵入する攻撃経路を説明せよ。", "a": "感染USBを管理用PCに接続して感染させ、その管理用PCを経由して店舗管理サーバへ侵入する。", "lesson": "リムーバブル媒体はマルウェア侵入経路になり得るため、接続制御・検査・権限分離が重要。", "background": "店舗管理環境ではUSBメモリを使ってデータを受け渡している。感染したUSBが管理用PCに接続された場合、内部サーバへ感染が拡大する可能性が判明した。"}, {"year": "令和3春", "src": "午後II 問1 設問4(1)", "tag": "脆弱性", "type": "text", "q": "複数の脆弱性を評価する際、単独では影響が小さい脆弱性を見送ることが危険な理由を一つ答えよ。", "a": "複数の脆弱性が組み合わされて悪用される可能性があるため。", "lesson": "脆弱性管理では個々のCVSSだけでなく、攻撃経路や組合せによるリスクも考える。", "background": "脆弱性対応の優先順位を決めている。単独では影響が小さい脆弱性が複数残っており、組み合わせによる攻撃可能性を評価することになった。"}, {"year": "令和3秋", "src": "午後II 問1 設問1(1)", "tag": "CSP", "type": "text", "q": "CSPでURL出力を制限する場合、許可するURLの形式を限定する方法を答えよ。", "a": "http://又はhttps://で始まるURLだけを出力するようにする。", "lesson": "URLを利用する機能では、スキームを含めた入力検証と出力時の安全性確認が必要。", "background": "Webアプリケーションで利用者が指定したURLを画面に表示する機能がある。悪意あるスキームを使った攻撃を防ぐため、入力値の扱いを見直した。"}, {"year": "令和3秋", "src": "午後II 問1 設問2(2)", "tag": "CSP", "type": "text", "q": "同一オリジンから読み込むスクリプトを許可するCSP上の考え方を答えよ。", "a": "URLと同じオリジンであるスクリプトファイルを許可する。", "lesson": "CSPではscript-src等のディレクティブでスクリプトの供給元を制限する。", "background": "Webサイトで外部スクリプトの読み込み範囲を制限している。自社サイトから提供するスクリプトだけを許可する構成を検討した。"}, {"year": "令和3秋", "src": "午後II 問1 設問3(2)", "tag": "SaaS", "type": "text", "q": "SaaSへファイルをアップロードする際、SaaS事業者にファイル内容を見られたくない場合の対策を答えよ。", "a": "利用者側でファイルを暗号化してからアップロードする。", "lesson": "クラウド上の保存先を信頼するだけでなく、利用者側暗号化による情報漏えい対策も検討する。", "background": "社外SaaSへ機密ファイルを保存する運用を検討している。SaaS事業者側の管理者を含め、保存中の内容を見られるリスクを下げたい。"}, {"year": "令和元秋", "src": "午後II 問1 設問1(1)", "tag": "マルウェア", "type": "text", "q": "同じDBMSの脆弱性を再び悪用されると、暗号資産マイニング用マルウェアが再感染する可能性がある。この場合の問題点を答えよ。", "a": "同じ脆弱性を悪用されて再感染し、既存のマルウェアの動作が阻害される可能性がある。", "lesson": "再発防止ではマルウェア削除だけでなく、侵入に利用された脆弱性の根本原因を除去する。", "background": "Webサービスで暗号資産マイニング用マルウェアの感染が確認された。マルウェアを除去しても、侵入に使われた脆弱性が残っていれば再感染する可能性がある。"}, {"year": "令和元秋", "src": "午後II 問2(3)", "tag": "ネットワーク", "type": "text", "q": "無線LANで端末のMACアドレスを登録制御に利用する場合、攻撃者によるなりすましを考慮してどのような対策を行うか。", "a": "端末のMACアドレスを許可されたMACアドレスに変更する攻撃を想定し、MACアドレスだけに依存しない認証を行う。", "lesson": "MACアドレス制御は補助的な制御であり、強い認証方式の代替にはならない。", "background": "社内無線LANで端末をMACアドレスによって識別している。MACアドレスの偽装によって未許可端末が接続できる可能性を評価した。"}, {"year": "令和元秋", "src": "午後II 問4", "tag": "DevOps", "type": "text", "q": "DevOps環境で実行環境のバージョンを把握し、最新状態に保つことが重要な理由を答えよ。", "a": "利用している実行環境に存在する脆弱性を把握し、修正済みのバージョンへ更新するため。", "lesson": "DevOpsでは開発速度だけでなく、依存コンポーネントの脆弱性管理を継続的に行う。", "background": "Webサービスを短いサイクルで開発・運用している。実行環境のバージョン管理が十分でなく、既知脆弱性が残存する可能性が問題になった。"}, {"year": "平成31春", "src": "午後II 問1 設問3(1)", "tag": "無線LAN", "type": "text", "q": "無線LAN通信でMACアドレスが平文で送信されることが問題となる理由を答えよ。", "a": "通信を観測した第三者に端末のMACアドレスを取得されるため。", "lesson": "MACアドレスは機器識別情報であり、追跡やなりすましに悪用され得る。", "background": "社内無線LANの通信方式を点検している。端末識別情報が無線区間で観測可能であることから、情報漏えいやなりすましへの影響を評価した。"}, {"year": "平成31春", "src": "午後II 問4", "tag": "暗号モード", "type": "text", "q": "ブロック暗号の暗号化で、平文ブロックをそのまま繰り返し暗号化する方式が持つ問題を一つ答えよ。", "a": "同じ平文ブロックが同じ暗号文ブロックになり、パターンが漏れる。", "lesson": "ECBのような方式ではブロック間の関係が隠れないため、用途に応じた安全な暗号モードが必要。", "background": "社内システムでブロック暗号を利用している。暗号文から元データのパターンが推測される可能性が指摘され、暗号モードの選定を見直した。"}], "variants": [{"year": "類題", "src": "類題オリジナル 01", "tag": "ファイルアップロード", "type": "text", "q": "ファイルアップロードについて、次の状況で担当者が優先して行うべき対策を一つ答えてください。", "a": "実行可能ファイルのアップロードを防ぐため、拡張子だけでなく実体確認と保存先分離を行う。", "lesson": "Webアプリの論点を別シナリオへ適用する練習。用語の暗記ではなく、脅威→成立条件→対策の因果関係を説明できることを重視します。", "background": "Webアプリに関する社内システムの設計・運用を見直している。現在の構成ではファイルアップロードに起因するセキュリティ上のリスクが残っていることが判明した。業務を止めずにリスクを低減する方法を検討することになった。"}, {"year": "類題", "src": "類題オリジナル 02", "tag": "XSS", "type": "text", "q": "XSSについて、次の状況で担当者が優先して行うべき対策を一つ答えてください。", "a": "利用者入力をHTMLに出力する際 const state={section:"home",bank:"past",filter:"all",idx:0,answered:{},score:{},choice:null};
const $=id=>document.getElementById(id);
const key=()=>`${state.bank}:${state.idx}`;
function save(){localStorage.setItem("sekispe_rebuild_v1",JSON.stringify({answered:state.answered,score:state.score}));}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem("sekispe_rebuild_v1")||"{}"));}catch(e){}}
function bank(){return state.bank==="past"?DB.past:DB.variants}
function renderHome(){
 $("home").classList.remove("hidden");$("exam").classList.add("hidden");
 $("countPast").textContent=DB.past.length+"問";$("countVar").textContent=DB.variants.length+"問";
 const list=bank().filter(q=>state.filter==="all"||q.year===state.filter);
 $("list").innerHTML=list.map((q,i)=>`<button class="item" onclick="start(${i})"><div class="itemTop"><b>${q.year}・${q.src}</b><span>${q.type==="text"?"記述":q.type==="multi"?"複数選択":"選択"}</span></div><div class="meta">${q.tag} ｜ ${q.background.slice(0,65)}…</div></button>`).join("");
 document.querySelectorAll(".tab").forEach((x,i)=>x.classList.toggle("active",(i===0&&state.bank==="past")||(i===1&&state.bank==="variant")));
 const years=[...new Set(DB.past.map(x=>x.year))];
 $("filters").innerHTML=`<button class="pill ${state.filter==="all"?"active":""}" onclick="setFilter('all')">すべて</button>`+years.map(y=>`<button class="pill ${state.filter===y?"active":""}" onclick="setFilter('${y}')">${y}</button>`).join("");
}
function setBank(b){state.bank=b;state.filter="all";renderHome()}
function setFilter(f){state.filter=f;renderHome()}
function start(i){state.idx=i;state.section="exam";state.choice=null;$("home").classList.add("hidden");$("exam").classList.remove("hidden");renderQ()}
function renderQ(){
 const arr=bank(),q=arr[state.idx],k=key(),saved=state.answered[k]||"";
 $("titleExam").textContent=state.bank==="past"?"過去問":"類題模試";
 $("pText").textContent=`Q${state.idx+1} / ${arr.length}`;
 $("bar").style.width=((state.idx+1)/arr.length*100)+"%";
 $("qid").textContent=`Q${state.idx+1}`;$("tag").textContent=q.tag;
 $("background").textContent=q.background;$("question").textContent=q.q;
 $("draft").value=q.type==="text"?saved:"";
 $("choices").innerHTML="";
 if(q.type!=="text") q.choices.forEach((c,i)=>{$("choices").insertAdjacentHTML("beforeend",`<button class="choice" data-i="${i}">${c}</button>`)});
 document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{state.choice=+b.dataset.i;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("sel"));b.classList.add("sel")});
 $("answer").classList.toggle("show",!!state.score[k]);
 $("model").textContent=Array.isArray(q.a)?q.a.join(" ／ "):q.a;$("lesson").textContent=q.lesson;
 if(state.score[k])markChoices(q);
}
function markChoices(q){
 if(q.type==="text")return;
 document.querySelectorAll(".choice").forEach((b,i)=>{const good=Array.isArray(q.a)?q.a.includes(q.choices[i]):q.choices[i]===q.a;if(good)b.classList.add("correct");});
}
$("reveal").onclick=()=>{
 const q=bank()[state.idx],k=key();
 if(q.type==="text"){state.answered[k]=$("draft").value.trim();}
 else{if(state.choice===null){alert("選択してください");return}state.answered[k]=q.choices[state.choice];}
 save();$("answer").classList.add("show");markChoices(q);
};
document.querySelectorAll(".score button").forEach(b=>b.onclick=()=>{state.score[key()]=+b.dataset.s;save();$("answer").classList.add("show")});
$("next").onclick=()=>{if(state.idx<bank().length-1){state.idx++;state.choice=null;renderQ()}else renderHome()};
$("prev").onclick=()=>{if(state.idx>0){state.idx--;state.choice=null;renderQ()}};
$("homeBtn").onclick=renderHome;$("back").onclick=renderHome;
$("draft").addEventListener("input",()=>{state.answered[key()]=$("draft").value;save()});
document.addEventListener("keydown",e=>{if(state.section!=="exam")return;if(e.key==="ArrowRight"&&state.idx<bank().length-1){state.idx++;renderQ()}if(e.key==="ArrowLeft"&&state.idx>0){state.idx--;renderQ()}});
load();renderHome();
</script></body></html>
