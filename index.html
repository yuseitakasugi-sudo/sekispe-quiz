<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>セキスペ採点官</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:700px;margin:auto;padding:18px 14px 40px}.card{background:#fff;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 3px 14px rgba(0,0,0,.07)}
h1{font-size:25px;margin:6px 0}.muted{color:#666;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:#f7f7f7;border-radius:12px;padding:12px;text-align:center}.num{font-size:22px;font-weight:700}
.badge{display:inline-block;background:#eef2ff;border-radius:999px;padding:5px 9px;font-size:12px}.tag{font-size:13px;color:#666;margin-left:6px}.q{font-size:18px;line-height:1.8;margin:18px 0}
textarea{width:100%;height:125px;border:1px solid #ddd;border-radius:11px;padding:12px;font-size:16px;resize:vertical}
button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:10px;font-size:16px;background:#111;color:#fff}button.secondary{background:#eee;color:#111}
.answer{display:none;border-top:1px solid #eee;margin-top:18px;padding-top:16px;line-height:1.7}.answer.show{display:block}
.choice{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.choice button{margin:0}.green{background:#e8f6ec;color:#146b2e}.yellow{background:#fff4d6;color:#725400}.red{background:#fdeaea;color:#8b2222}
.history{font-size:14px;line-height:1.6}.row{padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
nav{display:flex;gap:8px;margin-bottom:12px}nav button{margin:0}.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>セキスペ採点官</h1>
<div class="muted">午後問題トレーニング β</div>
<div class="stats">
<div class="stat"><div class="num" id="total">0</div><div class="muted">回答数</div></div>
<div class="stat"><div class="num" id="correct">0%</div><div class="muted">正答率</div></div>
<div class="stat"><div class="num" id="weak">0</div><div class="muted">要復習</div></div>
</div>
</div>

<nav>
<button id="quizTab">問題を解く</button>
<button id="historyTab" class="secondary">履歴</button>
</nav>

<section id="quiz">
<div class="card">
<span class="badge" id="qid"></span><span class="tag" id="tag"></span>
<div class="q" id="question"></div>
<textarea id="answerInput" placeholder="あなたの答案を書いてください"></textarea>
<button id="reveal">回答を見る</button>
<div id="answerBox" class="answer">
<strong>解答例</strong>
<p id="model"></p>
<strong>採点ポイント</strong>
<ul id="points"></ul>
<div class="muted">自己採点</div>
<div class="choice">
<button class="green" data-score="2">🟢 正解</button>
<button class="yellow" data-score="1">🟡 惜しい</button>
<button class="red" data-score="0">🔴 不正解</button>
</div>
<button id="next" class="secondary">次の問題</button>
</div>
</div>
</section>

<section id="history" class="card hidden">
<h2>回答履歴</h2>
<div id="historyList" class="history"></div>
<button id="clear" class="secondary">履歴を消去</button>
</section>
</div>

<script>
const questions=[
{id:1,tag:"SBOM",q:"脆弱性が公表された際、SBOMを利用すると何が容易になるか。",a:"利用しているソフトウェアやそのバージョンを明確にし、脆弱性の影響有無を容易に把握できる。",p:["利用ソフトウェアの把握","バージョンの把握","脆弱性の影響有無の把握"]},
{id:2,tag:"SAST / DAST / IAST",q:"SAST、DAST、IASTの違いを簡潔に説明せよ。",a:"SASTはソースコード等を解析、DASTは稼働中のアプリを外部から検査、IASTはアプリ内部の実行情報を利用して検査する。",p:["SAST＝静的解析","DAST＝動的・外部から検査","IAST＝実行時の内部情報を利用"]},
{id:3,tag:"サプライチェーン",q:"委託先がさらに別会社へ再委託する場合、再委託先にもどのようなセキュリティ対策を求めるべきか。",a:"元の委託先に要求しているものと同等のセキュリティ対策を、再委託先にも要求させる。",p:["再委託先にも要求を適用","同等水準の対策","再委託先を管理対象にする"]},
{id:4,tag:"セキュア開発",q:"開発工程の早い段階からセキュリティ対策を組み込む狙いは何か。",a:"後工程での手戻りや脆弱性の作り込みを減らし、早期に問題を発見・修正する。",p:["早期に対策","手戻り削減","脆弱性の早期発見・修正"]},
{id:5,tag:"CVSS",q:"CVSSのAttack Complexity（AC）は何を評価する指標か。",a:"脆弱性を悪用するために必要となる攻撃条件の複雑さを評価する。",p:["悪用条件","攻撃の複雑さ"]}
];

let current=0;
const key="sekispe_history_v1";
const load=()=>JSON.parse(localStorage.getItem(key)||"[]");
const save=h=>localStorage.setItem(key,JSON.stringify(h));
function renderStats(){
 const h=load(), n=h.length, c=h.filter(x=>x.score===2).length, w=h.filter(x=>x.score<2).length;
 document.getElementById("total").textContent=n;
 document.getElementById("correct").textContent=n?Math.round(c/n*100)+"%":"0%";
 document.getElementById("weak").textContent=w;
}
function renderQ(){
 const x=questions[current];
 document.getElementById("qid").textContent="Q"+x.id;
 document.getElementById("tag").textContent=x.tag;
 document.getElementById("question").textContent=x.q;
 document.getElementById("answerInput").value="";
 document.getElementById("answerBox").classList.remove("show");
 document.getElementById("model").textContent=x.a;
 document.getElementById("points").innerHTML=x.p.map(p=>"<li>"+p+"</li>").join("");
}
document.getElementById("reveal").onclick=()=>document.getElementById("answerBox").classList.add("show");
document.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{
 const h=load(), x=questions[current];
 h.push({qid:x.id,tag:x.tag,answer:document.getElementById("answerInput").value,score:Number(b.dataset.score),at:new Date().toLocaleString("ja-JP")});
 save(h); renderStats();
});
document.getElementById("next").onclick=()=>{current=(current+1)%questions.length;renderQ();window.scrollTo(0,0)};
document.getElementById("quizTab").onclick=()=>{document.getElementById("quiz").classList.remove("hidden");document.getElementById("history").classList.add("hidden")};
document.getElementById("historyTab").onclick=()=>{
 document.getElementById("quiz").classList.add("hidden");document.getElementById("history").classList.remove("hidden");
 const h=load(); document.getElementById("historyList").innerHTML=h.length?h.slice().reverse().map(x=>`<div class="row"><b>Q${x.qid} ${x.tag}</b> — ${x.score===2?"🟢":x.score===1?"🟡":"🔴"}<br><span class="muted">${x.at}</span><br>${x.answer||"（回答なし）"}</div>`).join(""):"まだ履歴はありません。";
};
document.getElementById("clear").onclick=()=>{if(confirm("履歴を消去しますか？")){localStorage.removeItem(key);renderStats();document.getElementById("historyList").textContent="履歴を消去しました。"}};
renderQ();renderStats();
</script>
</body></html>
