const MOCKS=[[{"year": "令和7秋", "src": "問3 設問3", "tag": "アクセス制御", "background": "Webアプリの脆弱性を悪用したインシデント、暗号鍵管理、リモートワーク、サプライチェーンを題材に、原因分析から技術的対策・運用手順までを検討する。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。Kサービス設定サイトへの接続元を制限する設定を答えよ。\n\n【資料：具体条件】\n・Kサービス設定サイトへのアクセスを許可する接続元IPアドレスを a1.b1.c1.d1 に限定する。\n・取引先サービスへの接続元として、P社専用のKサービス用固定グローバルIPアドレスを利用する。\n・HTTPSで許可する対象は、Z-IB、OSベンダのOSアップデート配布サイト、認証基盤サービス、Kサービス設定サイト。\n", "question": "Kサービス設定サイトへの接続元を制限する設定を答えよ。", "answer": "許可する接続元IPアドレスをa1.b1.c1.d1に制限する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和3春", "src": "問2 設問4(3)", "tag": "端末管理", "background": "Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。設問条件から指定された端末数・値を答えよ。\n\nなお、この設問は原典では図表・選択肢・設定値などの具体情報を使って判断する形式であるため、模試版では判断に必要な候補値・条件を背景側に明示する構成とする。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・対象システム：Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n・判断対象：設問条件から指定された端末数・値を答えよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "設問条件から指定された端末数・値を答えよ。", "answer": "1。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和3秋", "src": "問1 設問5(2)", "tag": "MFA", "background": "テレワークとクラウド移行を背景に、WebアプリのCSP対策、SaaS移行のリスク、他社を含むインシデント対応、マルウェアの横展開を分析している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。適切な多要素認証とアカウント管理の方法を答えよ。", "question": "適切な多要素認証とアカウント管理の方法を答えよ。", "answer": "生体認証を利用し、不要なKサービスのアカウントを削除・無効化する。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和5秋", "src": "問2 設問1", "tag": "無線LAN", "background": "Webアプリ、社内無線LAN、クラウドCIサービス、委託先との業務を題材に、XSS、無線LAN認証、クラウド侵害、リスクアセスメントといった複数の脅威を分析する。\n\n対象Web画面では利用者入力をHTMLとして表示する処理があり、管理者・一般利用者の双方が同じ画面を利用する。入力値が画面表示やブラウザ側処理に影響する可能性があるため ド移行後の設定、外部サービス連携、OAuth、OSSなどのセキュリティも見直す。\n\n外部サービスとの認可連携を行っており、利用者の認可要求、コールバック、トークンなど複数の情報を受け渡す。攻撃者による認可要求の差替えや不正な連携を防ぐ必要がある。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。アンケート画面の遷移を診断ツールで検証するためのURL設定を答えよ。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：診断条件】\n・アンケート入力1からアンケート入力2へ遷移する。\n・診断ツールのURL拡張機能にアンケート確認URLを登録する。\n・設問2(2)ではスクリプト入力として「(2-3)」が解答例に示される。\n", "question": "アンケート画面の遷移を診断ツールで検証するためのURL設定を答えよ。", "answer": "アンケート入力1から入力2へ遷移するURLの拡張機能に、アンケート確認URLを登録する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和2・10月", "src": "問1 設問1b", "tag": "LDAP", "background": "企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。認証で利用するディレクトリサービスを答えよ。\n\n【資料：設問を解くための判断材料】\n・ディレクトリ：LDAP-P / LDAP-Q / LDAP-Rなど複数ディレクトリを統合対象とする\n・設問では、上記の条件を組み合わせて判断する。", "question": "認証で利用するディレクトリサービスを答えよ。", "answer": "LDAP。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和元秋", "src": "問1 設問3(2)", "tag": "バージョン管理", "background": "WebアプリをDevOpsで開発・運用する企業で、マルウェア感染、ネットワーク露出、脆弱性管理、レビュー体制を見直している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。脆弱性対策のために実行環境をどう管理するか。", "question": "脆弱性対策のために実行環境をどう管理するか。", "answer": "システムを構成する実行環境のバージョンを把握し、常に最新に保つ。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和3春", "src": "問1 設問1(1)", "tag": "パスワードリスト攻撃", "background": "Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。外部流出したIDとパスワードの組を使ってログインを試す攻撃を何というか。", "question": "外部流出したIDとパスワードの組を使ってログインを試す攻撃を何というか。", "answer": "パスワードリスト攻撃。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和元秋", "src": "問1 設問3(1)", "tag": "脆弱性管理", "background": "WebアプリをDevOpsで開発・運用する企業で、マルウェア感染、ネットワーク露出、脆弱性管理、レビュー体制を見直している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。実行環境のバージョン管理で選択すべき対応を二つ答えよ。", "question": "実行環境のバージョン管理で選択すべき対応を二つ答えよ。\n\n【選択肢】\nア：CVSSによる脆弱性アセスメント\nイ：TTX\nウ：回帰テスト\nエ：ストレステスト\nオ：パッチの作成\nカ：変更の履歴\nキ：カーネル\nク：レビュー", "answer": "ア、ウ。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約", "choices": ["ア：CVSSによる脆弱性アセスメント", "イ：TTX", "ウ：回帰テスト", "エ：ストレステスト", "オ：パッチの作成", "カ：変更の履歴", "キ：カーネル", "ク：レビュー"]}, {"year": "令和2・10月", "src": "問2 設問1(1)", "tag": "MFA", "background": "企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。OTPアプリを利用する多要素認証で、攻撃者が第三者の端末を使って認証コードを生成する攻撃を説明せよ。\n\n【資料：設問を解くための判断材料】\n・対象システム：企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n・判断対象：OTPアプリを利用する多要素認証で、攻撃者が第三者の端末を使って認証コードを生成する攻撃を説明せよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "OTPアプリを利用する多要素認証で、攻撃者が第三者の端末を使って認証コードを生成する攻撃を説明せよ。", "answer": "第三者のOTPアプリで不正にOTPを生成される。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和7春", "src": "問1 設問5", "tag": "資産・脆弱性管理", "background": "システム開発企業で、委託先を含むサプライチェーンのセキュリティを見直している。開発工程への対策組込み、外部スクリプトの扱い、開発環境の管理、ソフトウェアの脆弱性管理までを一体で改善することになった。\n\nWebアプリやサーバでは複数のソフトウェアを利用しており、公開後に新しい脆弱性が判明する可能性がある。開発・運用のリリースサイクルと、脆弱性の修正・診断のタイミングを合わせる必要がある。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。開発・運用しているソフトウェアの脆弱性影響を把握しやすくするため、何を明確にするか。", "question": "開発・運用しているソフトウェアの脆弱性影響を把握しやすくするため、何を明確にするか。", "answer": "利用しているソフトウェアやそのバージョンが明確になり，脆弱性の影響有無を容易に把握できること", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和元秋", "src": "問2 設問1(2)", "tag": "APT", "background": "WebアプリをDevOpsで開発・運用する企業で、マルウェア感染、ネットワーク露出、脆弱性管理、レビュー体制を見直している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。攻撃モデルの適切な選択肢を答えよ。\n\nなお、この設問は原典では図表・選択肢・設定値などの具体情報を使って判断する形式であるため、模試版では判断に必要な候補値・条件を背景側に明示する構成とする。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・対象システム：WebアプリをDevOpsで開発・運用する企業で、マルウェア感染、ネットワーク露出、脆弱性管理、レビュー体制を見直している。\n・判断対象：攻撃モデルの適切な選択肢を答えよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "攻撃モデルの適切な選択肢を答えよ。", "answer": "エ。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和5春", "src": "問2 設問1", "tag": "クラウド設定", "background": "企業グループが多数のWebサイトを運用し、脆弱性診断を第三者委託・自社実施している。クラウド移行後の設定、外部サービス連携、OAuth、OSSなどのセキュリティも見直す。\n\n外部サービスとの認可連携を行っており、利用者の認可要求、コールバック、トークンなど複数の情報を受け渡す。攻撃者による認可要求の差替えや不正な連携を防ぐ必要がある。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。クラウド移行時の各設定について、正しいかどうか判定せよ。", "question": "クラウド移行時の各設定について、正しいかどうか判定せよ。", "answer": "設問の各項目を○×で判定する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和4秋", "src": "問1 設問3", "tag": "解析ログ", "background": "セキュリティ会社でマルウェアの動的解析とCTFを行っている。未知マルウェアの挙動、アカウント保護、ARPスプーフィング、ログへの秘密情報出力などを検討する。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。解析結果を示す時刻・ファイル・プロセスなどの値を、設問条件から正しく対応付ける。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・対象システム：セキュリティ会社でマルウェアの動的解析とCTFを行っている。\n・判断対象：解析結果を示す時刻・ファイル・プロセスなどの値を、設問条件から正しく対応付ける。\n・設問では、上記の条件を組み合わせて判断する。", "question": "解析結果を示す時刻・ファイル・プロセスなどの値を、設問条件から正しく対応付ける。", "answer": "各ログ項目を時系列とファイル操作の関係から対応付ける。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和元秋", "src": "問1 設問1(3)", "tag": "マルウェア解析", "background": "WebアプリをDevOpsで開発・運用する企業で、マルウェア感染、ネットワーク露出、脆弱性管理、レビュー体制を見直している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。マルウェアXが外部へ情報を送信していないと判断した根拠を説明せよ。", "question": "マルウェアXが外部へ情報を送信していないと判断した根拠を説明せよ。", "answer": "採掘結果以外の情報送信機能がなく、遠隔コマンド実行やSSH接続の痕跡もなかったため。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和5春", "src": "問2 設問2", "tag": "クラウド監視", "background": "企業グループが多数のWebサイトを運用し、脆弱性診断を第三者委託・自社実施している。クラウド移行後の設定、外部サービス連携、OAuth、OSSなどのセキュリティも見直す。\n\n外部サービスとの認可連携を行っており、利用者の認可要求、コールバック、トークンなど複数の情報を受け渡す。攻撃者による認可要求の差替えや不正な連携を防ぐ必要がある。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。オブジェクトストレージの削除イベントを対象とする監視ルールを定義せよ。\n\n【資料：監視ルール】\n監視イベントを次の条件で定義する。\n・system = \"4000\"\n・account = \"11[1-9][0-9]\"\n・service = \"オブジェクトストレージサービス\"\n・event = \"オブジェクトの削除\"\n", "question": "オブジェクトストレージの削除イベントを対象とする監視ルールを定義せよ。", "answer": "system=4000、account=11[1-9][0-9]、service=オブジェクトストレージサービス、event=オブジェクトの削除。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和7春", "src": "問1 設問3", "tag": "スクリプト管理", "background": "システム開発企業で、委託先を含むサプライチェーンのセキュリティを見直している。開発工程への対策組込み、外部スクリプトの扱い、開発環境の管理、ソフトウェアの脆弱性管理までを一体で改善することになった。\n\nWebアプリやサーバでは複数のソフトウェアを利用しており、公開後に新しい脆弱性が判明する可能性がある。開発・運用のリリースサイクルと、脆弱性の修正・診断のタイミングを合わせる必要がある。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。外部スクリプトを自社管理下に置くため、Sサービスでどのような配置方法を取るべきか。", "question": "外部スクリプトを自社管理下に置くため、Sサービスでどのような配置方法を取るべきか。", "answer": "スクリプトPをダウンロードしておき、システムQのサーバ上に配置する方法", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和5秋", "src": "問1 設問2", "tag": "XSS分割", "background": "Webアプリ、社内無線LAN、クラウドCIサービス、委託先との業務を題材に、XSS、無線LAN認証、クラウド侵害、リスクアセスメントといった複数の脅威を分析する。\n\n対象Web画面では利用者入力をHTMLとして表示する処理があり、管理者・一般利用者の双方が同じ画面を利用する。入力値が画面表示やブラウザ側処理に影響する可能性があるため、入力から表示までのデータの流れを確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。HTMLコメントとスクリプトが一つになるよう投稿を分割する攻撃の特徴を説明せよ。\n\n【資料：設問を解くための判断材料】\n・対象システム：Webアプリ、社内無線LAN、クラウドCIサービス、委託先との業務を題材に、XSS、無線LAN認証、クラウド侵害、リスクアセスメントといった複数の脅威を分析する。\n・判断対象：HTMLコメントとスクリプトが一つになるよう投稿を分割する攻撃の特徴を説明せよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "HTMLコメントとスクリプトが一つになるよう投稿を分割する攻撃の特徴を説明せよ。", "answer": "HTMLがコメントアウトされ一つのスクリプトになるような投稿を複数回に分けて行う。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和2・10月", "src": "問2 設問6(1)", "tag": "PIN/認証", "background": "企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。端末ログインを突破する攻撃方法を答えよ。\n\n【資料：設問を解くための判断材料】\n・対象システム：企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n・判断対象：端末ログインを突破する攻撃方法を答えよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "端末ログインを突破する攻撃方法を答えよ。", "answer": "パスワードの推測によってログインする。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和7春", "src": "問4 設問3", "tag": "サービス診断", "background": "企業で利用しなくなったドメインや公開サーバが残存し、攻撃に悪用されるリスクが発生している。IT資産の棚卸し、DNS、外部サービス、脆弱性スキャン、廃止手順を整理した。\n\n社内システムや外部サービスへの接続にDNSを利用している。名前解決結果を利用した通信や、外部から指定される名前を扱う処理があるため、名前解決と接続先の関係を確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。公開サーバについて、Webサービスだけが公開されていることと脆弱性の有無を確認するには何を行うか。\n\n【資料：診断条件】\n・公開サーバについて、ポートスキャンでWeb用ポートだけが開いていることを確認する。\n・その後、脆弱性スキャナーで脆弱性の有無を確認する。\n・脆弱性がある場合は、一旦サービスを停止して修正後に再開する。\n・対応判断に用いる評価値として、解答例に「4.0」が示されている。\n", "question": "公開サーバについて、Webサービスだけが公開されていることと脆弱性の有無を確認するには何を行うか。", "answer": "ポートスキャンでWebポートだけが開いていることを確認し、脆弱性スキャナーで脆弱性を確認する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和3春", "src": "問2 設問1(2)", "tag": "クラウド監視", "background": "Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。設問の監視方式として適切なものを選べ。\n\nなお、この設問は原典では図表・選択肢・設定値などの具体情報を使って判断する形式であるため、模試版では判断に必要な候補値・条件を背景側に明示する構成とする。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・クラウド条件：アクセス制御、監視、暗号化、外部公開設定を管理対象とする\n・設問では、上記の条件を組み合わせて判断する。", "question": "設問の監視方式として適切なものを選べ。", "answer": "オ。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和4秋", "src": "問2 設問5", "tag": "USB管理", "background": "セキュリティ会社でマルウェアの動的解析とCTFを行っている。未知マルウェアの挙動、アカウント保護、ARPスプーフィング、ログへの秘密情報出力などを検討する。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。許可されていないUSB媒体を検出する条件を答えよ。", "question": "許可されていないUSB媒体を検出する条件を答えよ。", "answer": "情報システム課が管理するUSB-IDのいずれにも一致しないUSB-IDが装着された場合。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和7春", "src": "問3 設問2", "tag": "アプリ解析・暗号", "background": "スマートフォンアプリがAPIを利用するサービスで、認証情報の取得、暗号化されたアクセスキー、URL形式、通信解析、WebViewの安全性など複数の脆弱性が発見された。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。暗号化されたアクセスキーをアプリ内部の情報から復号する場合、どのように解析するか。\n\n【資料：具体条件】\n・通信解析対象の正規サイト名は www.a-sha.co.jp。\n・正規通信は HTTPS を利用する。\n・通信解析ツールのプライベート認証局のルート証明書をインストールし、信頼設定を行う。\n・通信シーケンスの空欄 a～h は、HTTP CONNECT、200 OK、Client Hello、Server Hello、Certificate、Certificate Verify、Finished、GET /campaign/ の流れで構成される。\n", "question": "暗号化されたアクセスキーをアプリ内部の情報から復号する場合、どのように解析するか。", "answer": "アプリを解析し、暗号化されたアクセスキーと共通鍵・初期ベクトルを入手してAES-CBCで復号する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和3秋", "src": "問1 設問2(3)", "tag": "CSP", "background": "テレワークとクラウド移行を背景に、WebアプリのCSP対策、SaaS移行のリスク、他社を含むインシデント対応、マルウェアの横展開を分析している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。同一オリジンの外部スクリプトを安全に呼び出す方法を答えよ。", "question": "同一オリジンの外部スクリプトを安全に呼び出す方法を答えよ。", "answer": "スクリプトを同一オリジンに保存し、HTMLから別ファイルとして呼び出す。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和3春", "src": "問1 設問1(3)", "tag": "異常ログイン検知", "background": "Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。正規利用者本人かどうかを判断するため、過去のログインと何を比較するか。", "question": "正規利用者本人かどうかを判断するため、過去のログインと何を比較するか。", "answer": "IPアドレスから分かる地理的位置やブラウザCookieなどを比較する。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和3春", "src": "問1 設問3(2)", "tag": "認証", "background": "Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。認証に関する複数の設定値を正しく組み合わせよ。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・対象システム：Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n・判断対象：認証に関する複数の設定値を正しく組み合わせよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "認証に関する複数の設定値を正しく組み合わせよ。", "answer": "イ、カ、ウ。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}], [{"year": "令和6春", "src": "問1 設問3", "tag": "監視", "background": "スマートフォンアプリとAPIを連携するシステム、リモートワーク環境、Web脆弱性、Java/RDBMSアプリを題材に、脆弱性の原因と対策を検討する。\n\nJavaで実装されたWebアプリケーションがRDBMSやLDAPなどの外部サービスを利用している。入力値、例外、検索条件、権限、リソース解放などをコードレビューで確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。テストサーバへのアクセス監視、ログヘッダ、検知用正規表現、アラート後の運用を答えよ。\n\nなお、この設問は原典では図表・選択肢・設定値などの具体情報を使って判断する形式であるため、模試版では判断に必要な候補値・条件を背景側に明示する構成とする。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：監視条件】\n・テストサーバの index.html へのアクセスを記録する。\n・ログの Header を監視対象とする。\n・検出用正規表現は次のいずれか：\n  \\W[jJ][nN][dD][iI]\\W\n  \\W(j|J)(n|N)(d|D)(i|I)\\W\n・アラートを受信した場合は攻撃かどうかを精査し、誤検知による遮断を防ぐ。\n", "question": "テストサーバへのアクセス監視、ログヘッダ、検知用正規表現、アラート後の運用を答えよ。", "answer": "index.htmlへのアクセス記録、Headerの監視、大小文字を許容する正規表現、アラート後の精査。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和3秋", "src": "問2 設問4(4)", "tag": "封じ込め", "background": "テレワークとクラウド移行を背景に、WebアプリのCSP対策、SaaS移行のリスク、他社を含むインシデント対応、マルウェアの横展開を分析している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。被害拡大を止めるために行った一次対応を答えよ。", "question": "被害拡大を止めるために行った一次対応を答えよ。", "answer": "連携端末を一時的にネットワークから切り離す。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和3秋", "src": "問2 設問4(1)", "tag を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。設問のFWルールで必要なポート番号を答えよ。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・ネットワーク：TCP/UDPポート番号を使って通信を識別する\n・設問では、上記の条件を組み合わせて判断する。", "question": "設問のFWルールで必要なポート番号を答えよ。", "answer": "24。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和6秋", "src": "問2 設問4", "tag": "SPF/DKIM", "background": "ソフトウェア開発会社でマルウェア感染が発生し、社内端末間の横展開やアカウント侵害を調査している。メールサービスの変更、DMARC、Webスキミング、個人情報サイトの脆弱性も検討する。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。SPFとDKIMで異常メールを検出できる理由を答えよ。", "question": "SPFとDKIMで異常メールを検出できる理由を答えよ。", "answer": "SPFの送信元IP登録漏れや、DKIM署名とSubject変更の不一致を検知する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和7春", "src": "問4 設問4", "tag": "廃止・リスク管理", "background": "企業で利用しなくなったドメインや公開サーバが残存し、攻撃に悪用されるリスクが発生している。IT資産の棚卸し、DNS、外部サービス、脆弱性スキャン、廃止手順を整理した。\n\n社内システムや外部サービスへの接続にDNSを利用している。名前解決結果を利用した通信や、外部から指定される名前を扱う処理があるため、名前解決と接続先の関係を確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。公開サーバの対応を判断するとき、脆弱性情報の継続監視や対策実施確認をどう運用するか。\n\n【資料：設問を解くための判断材料】\n・対象システム：企業で利用しなくなったドメインや公開サーバが残存し、攻撃に悪用されるリスクが発生している。\n・判断対象：公開サーバの対応を判断するとき、脆弱性情報の継続監視や対策実施確認をどう運用するか。\n・設問では、上記の条件を組み合わせて判断する。", "question": "公開サーバの対応を判断するとき、脆弱性情報の継続監視や対策実施確認をどう運用するか。", "answer": "IT資産管理台帳上のソフトウェアの重要な脆弱性情報を継続確認し、該当部門へ優先度を伝えて対策実施を確認する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和元秋", "src": "問2 設問4(3)", "tag": "USB", "background": "WebアプリをDevOpsで開発・運用する企業で、マルウェア感染、ネットワーク露出、脆弱性管理、レビュー体制を見直している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。USB媒体を介したマルウェア侵入を防ぐ方法を答えよ。", "question": "USB媒体を介したマルウェア侵入を防ぐ方法を答えよ。", "answer": "USBメモリをマルウェア対策ソフトでスキャンする。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和2・10月", "src": "問2 設問3(2)", "tag": "情報漏えい", "background": "企業合併に伴って複数Webサイトを統合し、LDAP連携、 ar": "令和6春", "src": "問4 設問2", "tag": "例外/情報漏えい", "background": "スマートフォンアプリとAPIを連携するシステム、リモートワーク環境、Web脆弱性、Java/RDBMSアプリを題材に、脆弱性の原因と対策を検討する。\n\nJavaで実装されたWebアプリケーションがRDBMSやLDAPなどの外部サービスを利用している。入力値、例外、検索条件、権限、リソース解放などをコードレビューで確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。例外処理やログ出力により、運用担当者・開発者へ漏れてはいけない情報を答えよ。\n\n【資料：設問を解くための判断材料】\n・対象システム：スマートフォンアプリとAPIを連携するシステム、リモートワーク環境、Web脆弱性、Java/RDBMSアプリを題材に、脆弱性の原因と対策を検討する。\n・判断対象：例外処理やログ出力により、運用担当者・開発者へ漏れてはいけない情報を答えよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "例外処理やログ出力により、運用担当者・開発者へ漏れてはいけない情報を答えよ。", "answer": "パスワード、氏名、住所、電話番号、メールアドレス等の個人情報を不用意に出力しない。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和3春", "src": "問2 設問5(2)", "tag": "クラウド評価", "background": "Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。設問条件から該当する評価値を答えよ。\n\nなお、この設問は原典では図表・選択肢・設定値などの具体情報を使って判断する形式であるため、模試版では判断に必要な候補値・条件を背景側に明示する構成とする。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・クラウド条件：アクセス制御、監視、暗号化、外部公開設定を管理対象とする\n・設問では、上記の条件を組み合わせて判断する。", "question": "設問条件から該当する評価値を答えよ。", "answer": "4。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和3秋", "src": "問1 設問5(1)", "tag": "認証中継", "background": "テレワークとクラウド移行を背景に、WebアプリのCSP対策、SaaS移行のリスク、他社を含むインシデント対応、マルウェアの横展開を分析している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。攻撃者がメッセージをどのサービスとの間で中継するか。", "question": "攻撃者がメッセージをどのサービスとの間で中継するか。", "answer": "メッセージをKサービスとの間で中継する。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和5春", "src": "問2 設問5", "tag": "OSS/権限", "background": "企業グループが多数のWebサイトを運用し、脆弱性診断を第三者委託・自社実施している。クラウド移行後の設定、外部サービス連携、OAuth、OSSなどのセキュリティも見直す。\n\n外部サービスとの認可連携を行っており、利用者の認可要求、コールバック、トークンなど複数の情報を受け渡す。攻撃者による認可要求の差替えや不正な連携を防ぐ必要がある。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。OSSリポジトリでソース変更を安全に承認する権限とトークン権限をどう分離するか。", "question": "OSSリポジトリでソース変更を安全に承認する権限とトークン権限をどう分離するか。", "answer": "削除前ファイルを履歴から取得し、承認権限は開発リーダーだけに与え、Xトークンはダウンロード権限だけにする。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和2・10月", "src": "問1 設問2", "tag": "個人情報", "background": "企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n\n複数のサービスでディレクトリサービスを利用しており、認証対象となるサーバや利用者情報の所在を整理している。複数環境を統合する際に、どのサーバ・ディレクトリを参照するかが問題になっている。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。合併後の個人情報利用で守るべき制約を説明せよ。\n\n【資料：設問を解くための判断材料】\n・対象システム：企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n・判断対象：合併後の個人情報利用で守るべき制約を説明せよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "合併後の個人情報利用で守るべき制約を説明せよ。", "answer": "本人同意なしに、承継前の利用目的に必要な範囲を超えて扱わない。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和4春", "src": "問1 設問1", "tag": "ライブラリ管理", "background": "アジャイル開発でWebサイトを短い周期で改良している企業で、ライブラリ利用、セッション管理、アクセス制御、CSRF、脆弱性診断を見直している。\n\n利用者がログイン済みの状態で重要な操作を行えるWeb画面があり、外部サイトから利用者を誘導された場合にもリクエストが届く可能性を考慮している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。外部ライブラリを導入するとき、既知の脆弱性を持つライブラリを使わないために何を確認するか。", "question": "外部ライブラリを導入するとき、既知の脆弱性を持つライブラリを使わないために何を確認するか。", "answer": "既知脆弱性の有無を確認し、入手元を特定のWebサイトに限定してルール化する。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和2・10月", "src": "問2 設問4", "tag": "クラウド監査", "background": "企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n\n複数のサービスでディレクトリサービスを利用しており、認証対象となるサーバや利用者情報の所在を整理している。複数環境を統合する際に、どのサーバ・ディレクトリを参照するかが問題になっている。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。クラウドサービスのセキュリティ対策を確認するために何を見るか。\n\n【資料：設問を解くための判断材料】\n・クラウド条件：アクセス制御、監視、暗号化、外部公開設定を管理対象とする\n・設問では、上記の条件を組み合わせて判断する。", "question": "クラウドサービスのセキュリティ対策を確認するために何を見るか。", "answer": "第三者によるセキュリティ監査報告書を確認する。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和7春", "src": "問4 設問2", "tag": "公開資産発見", "background": "企業で利用しなくなったドメインや公開サーバが残存し、攻撃に悪用されるリスクが発生している。IT資産の棚卸し、DNS、外部サービス、脆弱性スキャン、廃止手順を整理した。\n\n社内システムや外部サービスへの接続にDNSを利用している。名前解決結果を利用した通信や、外部から指定される名前を扱う処理があるため、名前解決と接続先の関係を確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。未把握の公開IT資産を発見するため、レンタルサービスやデータセンターなどの契約情報をどう調べるか。\n\n【資料：設問を解くための判断材料】\n・対象システム：企業で利用しなくなったドメインや公開サーバが残存し、攻撃に悪用されるリスクが発生している。\n・判断対象：未把握の公開IT資産を発見するため、レンタルサービスやデータセンターなどの契約情報をどう調べるか。\n・設問では、上記の条件を組み合わせて判断する。", "question": "未把握の公開IT資産を発見するため、レンタルサービスやデータセンターなどの契約情報をどう調べるか。", "answer": "レンタルサービス及び他社データセンターの契約利用情報を調査する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和4春", "src": "問1 設問2", "tag": "セッション管理", "background": "アジャイル開発でWebサイトを短い周期で改良している企業で、ライブラリ利用、セッション管理、アクセス制御、CSRF、脆弱性診断を見直している。\n\n利用者がログイン済みの状態で重要な操作を行えるWeb画面があり、外部サイトから利用者を誘導された場合にもリクエストが届く可能性を考慮している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。設問のWebアプリケーションで利用者を識別する情報と、サーバ側で保持する認証状態を答えよ。", "question": "設問のWebアプリケーションで利用者を識別する情報と、サーバ側で保持する認証状態を答えよ。", "answer": "利用者IDとセッションオブジェクト。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和3秋", "src": "問2 設問1(2)", "tag": "暗号", "background": "テレワークとクラウド移行を背景に、WebアプリのCSP対策、SaaS移行のリスク、他社を含むインシデント対応、マルウェアの横展開を分析している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。暗号方式の評価で利用する標準を答えよ。", "question": "暗号方式の評価で利用する標準を答えよ。", "answer": "CRYPTREC。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和6秋", "src": "問4 設問3", "tag": "WebAPI", "background": "ソフトウェア開発会社でマルウェア感染が発生し、社内端末間の横展開やアカウント侵害を調査している。メールサービスの変更、DMARC、Webスキミング、個人情報サイトの脆弱性も検討する。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。WebAPIキー流出時の被害を限定する改善策を答えよ。", "question": "WebAPIキー流出時の被害を限定する改善策を答えよ。", "answer": "IDを推測困難にする、アクセス元IPを限定する、個人特定不能情報だけを返す等。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和元秋", "src": "問1 設問2(4)", "tag": "アクセス制御", "background": "WebアプリをDevOpsで開発・運用する企業で、マルウェア感染、ネットワーク露出、脆弱性管理、レビュー体制を見直している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。ネットワーク設定の選択肢を正しく対応させよ。\n\nなお、この設問は原典では図表・選択肢・設定値などの具体情報を使って判断する形式であるため、模試版では判断に必要な候補値・条件を背景側に明示する構成とする。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・対象システム：WebアプリをDevOpsで開発・運用する企業で、マルウェア感染、ネットワーク露出、脆弱性管理、レビュー体制を見直している。\n・判断対象：ネットワーク設定の選択肢を正しく対応させよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "ネットワーク設定の選択肢を正しく対応させよ。", "answer": "オ、カ、キ。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和7春", "src": "問2 設問4", "tag": "URL推測対策", "background": "公開サイトの脆弱性診断を行っている。検出された脆弱性について深刻度と対応優先度を判断し、ログ監視や認証、推測困難なURL、EPSSなども含めて具体的な対応を検討した。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。発注確認機能に対して、攻撃者がURLを推測して不正利用するリスクを下げるために確認すべき点を答えよ。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：具体条件】\n・発注確認機能では、パラメータ WA-1 の item 値が利用される。\n・WA-1 は item 値が容易に推測できる場合にリスクがある。\n・別の条件 WB-1 では、発注確認機能のURLが推測困難であること、かつURLを入手する必要があることを確認する。\n・設問4(2)の解答例の数値は「3」。\n", "question": "発注確認機能に対して、攻撃者がURLを推測して不正利用するリスクを下げるために確認すべき点を答えよ。", "answer": "WA-1のitem値が容易に推測できないこと、発注確認機能のURLが推測困難で取得も容易ではないこと。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和7春", "src": "問1 設問2", "tag": "再委託管理", "background": "システム開発企業で、委託先を含むサプライチェーンのセキュリティを見直している。開発工程への対策組込み、外部スクリプトの扱い、開発環境の管理、ソフトウェアの脆弱性管理までを一体で改善することになった。\n\nWebアプリやサーバでは複数のソフトウェアを利用しており、公開後に新しい脆弱性が判明する可能性がある。開発・運用のリリースサイクルと、脆弱性の修正・診断のタイミングを合わせる必要がある。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。一次委託先から再委託先へも同等のセキュリティ要求を引き継がせるには、何を要求させるべきか。", "question": "一次委託先から再委託先へも同等のセキュリティ要求を引き継がせるには、何を要求させるべきか。", "answer": "L社の業務委託先に要求する対策と同等のセキュリティ対策を再委託先にも要求させること", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和3春", "src": "問2 設問4(4)", "tag": "TLS認証", "background": "Webサービ question": "Webアクセスを利用して工場内端末へ攻撃する条件を特定せよ。", "answer": "User-AgentヘッダがA社で利用するブラウザを示す値であるケース。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和7秋", "src": "問3 設問1", "tag": "DNSSEC/DoH", "background": "Webアプリの脆弱性を悪用したインシデント、暗号鍵管理、リモートワーク、サプライチェーンを題材に、原因分析から技術的対策・運用手順までを検討する。\n\n社内システムや外部サービスへの接続にDNSを利用している。名前解決結果を利用した通信や、外部から指定される名前を扱う処理があるため、名前解決と接続先の関係を確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。DNS安全化のため、DNSSEC、DoH、TLSの対応を答えよ。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・名前解決：DNS / DNSSEC / DoH / TLSに関する設定を対象\n・設問では、上記の条件を組み合わせて判断する。", "question": "DNS安全化のため、DNSSEC、DoH、TLSの対応を答えよ。", "answer": "DNSSEC、DoH、TLS。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和5春", "src": "問2 設問4", "tag": "OAuth", "background": "企業グループが多数のWebサイトを運用し、脆弱性診断を第三者委託・自社実施している。クラウド移行後の設定、外部サービス連携、OAuth、OSSなどのセキュリティも見直す。\n\n外部サービスとの認可連携を行っており、利用者の認可要求、コールバック、トークンなど複数の情報を受け渡す。攻撃者による認可要求の差替えや不正な連携を防ぐ必要がある。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。OAuthの認可要求が不正取得されにくくなる検証方法を答えよ。\n\n【資料：OAuth条件】\n・アクセストークン要求には code パラメータが必要。\n・検証コードをSHA-256でハッシュ化し、base64urlエンコードした値とチャレンジコードを比較する。\n", "question": "OAuthの認可要求が不正取得されにくくなる検証方法を答えよ。", "answer": "検証コードのSHA-256ハッシュ値をbase64urlエンコードした値とchallenge codeの一致を確認する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}], [{"year": "令和2・10月", "src": "問2 設問5", "tag": "端末認証", "background": "企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。DaaSで端末そのものを認証する方法を答えよ。\n\n【資料：設問を解くための判断材料】\n・対象システム：企業合併に伴って複数Webサイトを統合し、LDAP連携、個人情報の取扱い、Java実装、パスワードリセット、SAML連携を安全に設計している。\n・判断対象：DaaSで端末そのものを認証する方法を答えよ。\n・設問では、上記の条件を組み合わせて判断する。", "question": "DaaSで端末そのものを認証する方法を答えよ。", "answer": "クライアント証明書によるデバイス認証。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和5秋", "src": "問3 設問1", "tag": "RADIUS", "background": "Webアプリ、社内無線LAN、クラウドCIサービス、委託先との業務を題材に、XSS、無線LAN認証、クラウド侵害、リスクアセスメントといった複数の脅威を分析する。\n\n対象Web画面では利用者入力をHTMLとして表示する処理があり、管理者・一般利用者の双方が同じ画面を利用する。入力値が画面表示やブラウザ側処理に影響する可能性があるため、入力から表示までのデータの流れを確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。無線LAN認証サーバとして利用するプロトコル/方式を答えよ。\n\n【資料：無線LAN構成】\n・無線LAN認証サーバには RADIUS を利用する。\n・EAP-TLSに必要な認証情報として秘密鍵を扱い、業務PCから取り出せないように保護する。\n・EAP-TLSに必要な認証情報は業務PCにしか格納できない、という条件を扱う。\n", "question": "無線LAN認証サーバとして利用するプロトコル/方式を答えよ。", "answer": "RADIUS。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和3秋", "src": "問1 設問2(1)", "tag": "URL検証", "background": "テレワークとクラウド移行を背景に、WebアプリのCSP対策、SaaS移行のリスク、他社を含むインシデント対応、マルウェアの横展開を分析している。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。危険なスキームを避けるため、出力するURLにどんな制限を設けるか。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【資料：設問を解くための判断材料】\n・対象システム：テレワークとクラウド移行を背景に、WebアプリのCSP対策、SaaS移行のリスク、他社を含むインシデント対応、マルウェアの横展開を分析している。\n・判断対象：危険なスキームを避けるため、出力するURLにどんな制限を設けるか。\n・設問では、上記の条件を組み合わせて判断する。", "question": "危険なスキームを避けるため、出力するURLにどんな制限を設けるか。", "answer": "http://またはhttps://で始まるURLだけを出力する。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和3春", "src": "問1 設問5", "tag": "脆弱性管理", "background": "Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。対応を見送った脆弱性を再評価するとき、何を考慮するか。", "question": "対応を見送った脆弱性を再評価するとき、何を考慮するか。", "answer": "複数脆弱性の同時悪用可能性と、対応を見送った脆弱性の影響。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和6春", "src": "問2 設問2", "tag": "フィッシングMFA", "background": "スマートフォンアプリとAPIを連携するシステム、リモートワーク環境、Web脆弱性、Java/RDBMSアプリを題材に、脆弱性の原因と対策を検討する。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システ いに明示する構成とする。\n\n【資料：API認証条件】\n・APIはステートレス方式。\n・JWTヘッダの alg を検証し、値は NONE ではないことを確認する。\n・JWTに含まれる利用者IDと mid の一致を検証する。\n・連続失敗回数がしきい値を超えた場合にアカウントをロックする。\n・設問1(2)の選択値として「500」が示されている。\n", "question": "JWTのalg、利用者ID、共通モジュール、アカウントロックなどについて安全な検証・制御方法を答えよ。", "answer": "algの検証、JWTの利用者IDとmidの一致確認、共通モジュールPの利用、連続失敗時のアカウントロック。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和3春", "src": "問1 設問1(2)", "tag": "パスワード管理", "background": "Webサービスの不正ログインが増加し、外部流出した認証情報を使う攻撃、USB媒体からの侵入、脆弱性の連鎖悪用を含むインシデント対応体制を整備している。\n\n利用者認証を行う社内／外部サービスがあり、ログイン失敗、認証情報、追加認証、アカウント状態などを管理している。攻撃者による認証情報の悪用を想定し、認証経路と監視方法を検討している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。他サービスからの認証情報流用を防ぐため、利用者にどのような設定を求めるか。", "question": "他サービスからの認証情報流用を防ぐため、利用者にどのような設定を求めるか。", "answer": "他サービスとは異なるパスワードを設定させる。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和4秋", "src": "問2 設問4", "tag": "ファイル特徴", "background": "セキュリティ会社でマルウェアの動的解析とCTFを行っている。未知マルウェアの挙動、アカウント保護、ARPスプーフィング、ログへの秘密情報出力などを検討する。\n\n社内端末やサーバで不審なファイル実行・通信が発生し、感染端末の特定、侵入経路、横展開、外部通信などを時系列で調査している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。EDRで圧縮ファイル等を識別するために見るべき特徴量を答えよ。", "question": "EDRで圧縮ファイル等を識別するために見るべき特徴量を答えよ。", "answer": "添付ファイル名、サイズ、アップロードサイズ、アクセス先URL、圧縮ファイル名など。", "type": "text", "source": "IPA公式問題・解答例を確認し、学習用に背景／問いへ要約"}, {"year": "令和7秋", "src": "問1 設問4", "tag": "脆弱性診断", "background": "Webアプリの脆弱性を悪用したインシデント、暗号鍵管理、リモートワーク、サプライチェーンを題材に、原因分析から技術的対策・運用手順までを検討する。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。サービス固有の仕様に依存する脆弱性を見つけるため、どのような診断を行うか。", "question": "サービス固有の仕様に依存する脆弱性を見つけるため、どのような診断を行うか。", "answer": "Sサービスの仕様を理解した専門家による脆弱性検査。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}, {"year": "令和7秋", "src": "問4 設問2", "tag": "リスク対応", "background": "Webアプリの脆弱性を悪用したインシデント、暗号鍵管理、リモートワーク、サプライチェーンを題材に、原因分析から技術的対策・運用手順までを検討する。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。リスク対応の基本的な選択肢を答えよ。\n\nなお、この設問は原典では図表・選択肢・設定値などの具体情報を使って判断する形式であるため、模試版では判断に必要な候補値・条件を背景側に明示する構成とする。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を る。入力値、例外、検索条件、権限、リソース解放などをコードレビューで確認している。\n\n今回、担当者には上記システムの構成・設定・ログなど、問題文で示された情報が与えられている。Java/RDBMSアプリのコードレビューで、入力値や権限属性に関する問題を識別せよ。\n\n【この設問で与えられる判断材料】\n設問文に記載された設定値・名称・ログ・通信条件を基に判断する。問題冊子にある図表を別途参照する前提にはせず、必要な値はこの背景・問いに明示する構成とする。\n\n【明示される対象】\nJava が設問の対象となる。\n\n【資料：コードレビュー条件】\n・設問中のコードでは personal などの属性値を扱う。\n・入力値、権限属性、例外、パスワード等の情報漏えいを確認する。\n・設問で示される具体値の一つは「4」。\n", "question": "Java/RDBMSアプリのコードレビューで、入力値や権限属性に関する問題を識別せよ。", "answer": "設問の選択肢で示された安全な値・属性を使用する。", "type": "text", "source": "IPA公式問題・解答例を基にした学習用要約"}]];let M={mi:0,qi:0};const $=x=>document.getElementById(x);
