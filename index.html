<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>セキスペ過去問</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #111827;
      --ok: #166534;
      --ng: #991b1b;
      --mid: #92400e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header strong {
      white-space: nowrap;
    }

    select, input, textarea, button, a.button {
      font: inherit;
    }

    select, input {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 0 10px;
    }

    #examSelect {
      min-width: 230px;
      max-width: 420px;
    }

    button, a.button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    button:hover, a.button:hover { background: #f3f4f6; }

    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .primary:hover { background: #000; }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(320px, .8fr);
      gap: 12px;
      padding: 12px;
      height: calc(100vh - 59px);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      min-height: 0;
    }

    .pdf-panel {
      display: flex;
      flex-direction: column;
    }

    .pdf-toolbar {
      min-height: 44px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    iframe {
      border: 0;
      width: 100%;
      flex: 1;
      background: #eee;
    }

    .answer-panel {
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      overflow: auto;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row input {
      flex: 1;
      min-width: 0;
    }

    label {
      font-size: 13px;
      font-weight: 600;
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus, input:focus, select:focus {
      border-color: #9ca3af;
      outline: 2px solid #e5e7eb;
      outline-offset: 1px;
    }

    .save-state {
      font-size: 12px;
      color: var(--muted);
      margin-left: auto;
    }

    .score-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .score {
      font-weight: 700;
    }

    .score.active.good {
      background: #dcfce7;
      border-color: #86efac;
      color: var(--ok);
    }

    .score.active.mid {
      background: #fef3c7;
      border-color: #fcd34d;
      color: var(--mid);
    }

    .score.active.bad {
      background: #fee2e2;
      border-color: #fca5a5;
      color: var(--ng);
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .stats {
      padding: 10px 12px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 900px) {
      header {
        flex-wrap: wrap;
        padding: 10px;
      }

      header strong {
        width: 100%;
      }

      #examSelect {
        min-width: 0;
        flex: 1 1 100%;
        max-width: none;
      }

      main {
        height: auto;
        grid-template-columns: 1fr;
      }

      .pdf-panel {
        height: 60vh;
      }

      .answer-panel {
        min-height: 420px;
      }
    }
  </style>
</head>

<body>
  <header>
    <strong>セキスペ過去問</strong>

    <select id="examSelect" aria-label="過去問を選択"></select>

    <a id="openPdf" class="button primary" href="#" target="_blank" rel="noopener">
      問題PDF
    </a>

    <a id="openAnswer" class="button" href="#" target="_blank" rel="noopener">
      解答PDF
    </a>
  </header>

  <main>
    <section class="panel pdf-panel">
      <div class="pdf-toolbar">
        <span id="pdfTitle">問題PDF</span>
      </div>
      <iframe id="pdfFrame" title="IPA 情報処理安全確保支援士 過去問題PDF"></iframe>
    </section>

    <section class="panel answer-panel">
      <div>
        <label for="questionId">設問</label>
        <div class="row">
          <input
            id="questionId"
            placeholder="例：問1 設問2(1)"
            autocomplete="off"
          />
          <button id="loadQuestion">切替</button>
        </div>
        <div class="meta" style="margin-top:6px">
          設問名を入力して「切替」。設問ごとに回答を別保存します。
        </div>
      </div>

      <div>
        <div class="row">
          <label for="answer">自分の回答</label>
          <span id="saveState" class="save-state">自動保存</span>
        </div>
        <textarea id="answer" placeholder="ここに回答を書く"></textarea>
      </div>

      <div>
        <label>自己採点</label>
        <div class="score-group" style="margin-top:8px">
          <button class="score good" data-score="2">○ 正解</button>
          <button class="score mid" data-score="1">△ 部分点</button>
          <button class="score bad" data-score="0">× 不正解</button>
        </div>
      </div>

      <div>
        <label for="memo">復習メモ</label>
        <textarea id="memo" style="min-height:110px" placeholder="間違えた理由、覚えることなど"></textarea>
      </div>

      <div id="stats" class="stats"></div>

      <button id="clearCurrent">この設問の保存内容を削除</button>

      <p class="meta">
        問題・解答PDF：IPA公式。回答・採点・メモはこの端末のブラウザ内に保存されます。
      </p>
    </section>
  </main>

<script>
  const EXAMS = [
    {
      id: "r07a",
      label: "令和7年度 秋期｜午後",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_sc_pm_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07a_sc_pm_ans.pdf"
    },
    {
      id: "r07h",
      label: "令和7年度 春期｜午後",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_sc_pm_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/nl10bi0000009lh8-att/2025r07h_sc_pm_ans.pdf"
    },
    {
      id: "r06a",
      label: "令和6年度 秋期｜午後",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_sc_pm_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_sc_pm_ans.pdf"
    },
    {
      id: "r06h",
      label: "令和6年度 春期｜午後",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_sc_pm_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_sc_pm_ans.pdf"
    },
    {
      id: "r05a",
      label: "令和5年度 秋期｜午後",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05a_sc_pm_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05a_sc_pm_ans.pdf"
    },
    {
      id: "r05h",
      label: "令和5年度 春期｜午後II",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_sc_pm2_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_sc_pm2_ans.pdf"
    },
    {
      id: "r04a",
      label: "令和4年度 秋期｜午後II",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000008smf-att/2022r04a_sc_pm2_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000008smf-att/2022r04a_sc_pm2_ans.pdf"
    },
    {
      id: "r04h",
      label: "令和4年度 春期｜午後II",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_sc_pm2_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_sc_pm2_ans.pdf"
    },
    {
      id: "r03a",
      label: "令和3年度 秋期｜午後II",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_sc_pm2_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000apad-att/2021r03a_sc_pm2_ans.pdf"
    },
    {
      id: "r03h",
      label: "令和3年度 春期｜午後II",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_sc_pm2_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d5ru-att/2021r03h_sc_pm2_ans.pdf"
    },
    {
      id: "r02o",
      label: "令和2年度 10月｜午後II",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_sc_pm2_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000d05l-att/2020r02o_sc_pm2_ans.pdf"
    },
    {
      id: "r01a",
      label: "令和元年度 秋期｜午後II",
      question: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_sc_pm2_qs.pdf",
      answer: "https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt8000000dict-att/2019r01a_sc_pm2_ans.pdf"
    }
  ];

  const examSelect = document.getElementById("examSelect");
  const pdfFrame = document.getElementById("pdfFrame");
  const openPdf = document.getElementById("openPdf");
  const openAnswer = document.getElementById("openAnswer");
  const pdfTitle = document.getElementById("pdfTitle");

  const questionId = document.getElementById("questionId");
  const loadQuestion = document.getElementById("loadQuestion");
  const answer = document.getElementById("answer");
  const memo = document.getElementById("memo");
  const saveState = document.getElementById("saveState");
  const scoreButtons = [...document.querySelectorAll(".score")];
  const clearCurrent = document.getElementById("clearCurrent");
  const stats = document.getElementById("stats");

  let currentExam = EXAMS[0];
  let currentQuestion = "問1";
  let saveTimer;

  function storageKey() {
    const q = currentQuestion.trim() || "未分類";
    return `sekispe:${currentExam.id}:${q}`;
  }

  function lastQuestionKey(examId) {
    return `sekispe:lastQuestion:${examId}`;
  }

  function populateExams() {
    EXAMS.forEach(exam => {
      const option = document.createElement("option");
      option.value = exam.id;
      option.textContent = exam.label;
      examSelect.appendChild(option);
    });
  }

  function selectExam(id) {
    currentExam = EXAMS.find(x => x.id === id) || EXAMS[0];

    localStorage.setItem("sekispe:lastExam", currentExam.id);
    examSelect.value = currentExam.id;

    pdfFrame.src = currentExam.question;
    openPdf.href = currentExam.question;
    openAnswer.href = currentExam.answer;
    pdfTitle.textContent = currentExam.label + " / 問題PDF";

    currentQuestion = localStorage.getItem(lastQuestionKey(currentExam.id)) || "問1";
    questionId.value = currentQuestion;

    loadSaved();
    updateStats();
  }

  function loadSaved() {
    const saved = JSON.parse(localStorage.getItem(storageKey()) || "{}");

    answer.value = saved.answer || "";
    memo.value = saved.memo || "";
    setScore(saved.score);

    saveState.textContent = saved.updatedAt
      ? `保存済み ${new Date(saved.updatedAt).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        })}`
      : "未保存";
  }

  function save() {
    const active = scoreButtons.find(b => b.classList.contains("active"));

    const data = {
      answer: answer.value,
      memo: memo.value,
      score: active ? Number(active.dataset.score) : null,
      updatedAt: Date.now()
    };

    localStorage.setItem(storageKey(), JSON.stringify(data));
    saveState.textContent = "保存済み";
    updateStats();
  }

  function autosave() {
    saveState.textContent = "保存中…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 250);
  }

  function setScore(value) {
    scoreButtons.forEach(btn => {
      btn.classList.toggle(
        "active",
        value !== null &&
        value !== undefined &&
        Number(btn.dataset.score) === Number(value)
      );
    });
  }

  function switchQuestion() {
    save();

    currentQuestion = questionId.value.trim() || "問1";
    questionId.value = currentQuestion;

    localStorage.setItem(lastQuestionKey(currentExam.id), currentQuestion);
    loadSaved();
  }

  function updateStats() {
    const prefix = `sekispe:${currentExam.id}:`;

    let good = 0;
    let mid = 0;
    let bad = 0;
    let total = 0;

    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith(prefix)) continue;

      try {
        const data = JSON.parse(localStorage.getItem(key));

        if (data.score === 2) good++;
        if (data.score === 1) mid++;
        if (data.score === 0) bad++;
        if ([0, 1, 2].includes(data.score)) total++;
      } catch (_) {}
    }

    if (!total) {
      stats.textContent = "採点済み：0問";
      return;
    }

    stats.textContent =
      `採点済み：${total}問　○ ${good}　△ ${mid}　× ${bad}　正解率 ${Math.round(good / total * 100)}%`;
  }

  examSelect.addEventListener("change", () => {
    save();
    selectExam(examSelect.value);
  });

  loadQuestion.addEventListener("click", switchQuestion);

  questionId.addEventListener("keydown", e => {
    if (e.key === "Enter") switchQuestion();
  });

  answer.addEventListener("input", autosave);
  memo.addEventListener("input", autosave);

  scoreButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      const isActive = btn.classList.contains("active");
      setScore(isActive ? null : Number(btn.dataset.score));
      save();
    });
  });

  clearCurrent.addEventListener("click", () => {
    if (!confirm(`「${currentQuestion}」の保存内容を削除しますか？`)) return;

    localStorage.removeItem(storageKey());
    loadSaved();
    updateStats();
  });

  window.addEventListener("beforeunload", save);

  populateExams();

  const savedExam = localStorage.getItem("sekispe:lastExam");
  const initialExam = EXAMS.some(x => x.id === savedExam)
    ? savedExam
    : EXAMS[0].id;

  selectExam(initialExam);
</script>
</body>
</html>
