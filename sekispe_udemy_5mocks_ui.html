<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>セキスペ午後問題演習</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;min-height:100vh;margin:auto;padding:18px 14px 30px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.title{font-size:22px;font-weight:800}.sub{font-size:12px;color:#777;margin-top:3px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 3px 16px rgba(0,0,0,.07)}
.hidden{display:none!important}
h1{font-size:25px;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}
.mock-grid{display:grid;gap:12px}
.mock{background:#fff;border:0;border-radius:18px;padding:18px;text-align:left;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.mock strong{display:block;font-size:18px}.mock span{display:block;color:#777;font-size:13px;margin-top:5px}
.mock .mini{margin-top:12px;height:6px;background:#eee;border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;background:#111}
.progress{background:#fff;border-radius:16px;padding:13px 15px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:8px}
.bar{height:7px;background:#e9e9e9;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#111}
.badge{display:inline-block;background:#eef2ff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}
.tag{color:#777;font-size:13px;margin-left:8px}
.question{font-size:20px;line-height:1.8;font-weight:650;margin:22px 0}
textarea{width:100%;min-height:175px;border:1px solid #ddd;border-radius:14px;padding:14px;font-size:17px;line-height:1.6;resize:none;outline:none}
textarea:focus{border-color:#777}
.save-note{font-size:11px;color:#888;margin-top:7px}
button{border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:700}
.primary{background:#111;color:#fff}.secondary{background:#eee;color:#111}
.full{width:100%;margin-top:12px}
.answer{display:none;border-top:1px solid #eee;margin-top:20px;padding-top:18px;line-height:1.75}
.answer.show{display:block}.label{font-size:12px;color:#777;font-weight:700}.model{font-size:16px;margin:5px 0 15px}
.points{background:#f7f7f7;border-radius:12px;padding:10px 18px}
.points li{margin:5px 0}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.choices button{font-size:14px;padding:12px}.green{background:#e8f6ec;color:#17652c}.yellow{background:#fff3cf;color:#735500}.red{background:#fdeaea;color:#8a2222}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.nav button{width:100%}
.meta{text-align:center;color:#777;font-size:12px;margin-top:12px}
.result{text-align:center}.score{font-size:48px;font-weight:800;margin:12px}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.resultitem{background:#f7f7f7;border-radius:12px;padding:13px}.num{font-size:22px;font-weight:800}
.back{background:transparent;padding:6px 0;font-size:14px;color:#555}
.notice{font-size:12px;color:#8a5a00;background:#fff7df;border-radius:12px;padding:10px;margin-bottom:14px}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div><div class="title">セキスペ午後問題演習</div><div class="sub">Udemy型・1問1画面</div></div>
</header>

<section id="home">
<div class="card">
<h1>模試を選択</h1>
<p style="color:#666;margin-top:0">各模試60問。途中の答案・進捗・自己採点はこの端末に保存されます。</p>
<div class="notice">現在のHTMLはUI動作確認用です。問題データはIPA公式資料の照合後に差し替えます。</div>
<div class="mock-grid" id="mockGrid"></div>
</div>
</section>

<section id="exam" class="hidden">
<button class="back" id="backHome">← 模試一覧に戻る</button>
<div class="progress">
<div class="row"><span id="mockTitle">模試1</span><span id="progressText">Q1 / 60</span></div>
<div class="bar"><i id="progressBar"></i></div>
</div>

<div class="card">
<div><span class="badge" id="qid">Q1</span><span class="tag" id="tag"></span></div>
<div class="question" id="question"></div>
<textarea id="draft" placeholder="あなたの答案を書いてください"></textarea>
<div class="save-note">入力内容は自動保存されます</div>
<button class="primary full" id="reveal">回答を見る</button>

<div class="answer" id="answer">
<div class="label">解答例</div>
<div class="model" id="model"></div>
<div class="label">採点ポイント</div>
<ul class="points" id="points"></ul>
<div class="label">自己採点</div>
<div class="choices">
<button class="green" data-score="2">🟢 正解</button>
<button class="yellow" data-score="1">🟡 惜しい</button>
<button class="red" data-score="0">🔴 不正解</button>
</div>
<button class="primary full" id="next">次の問題 →</button>
</div>

<div class="nav">
<button class="secondary" id="prev">← 前の問題</button>
<button class="secondary" id="nextTop">次の問題 →</button>
</div>
<div class="meta" id="status"></div>
</div>
</section>

<section id="result" class="hidden">
<div class="card result">
<h2 id="resultTitle">模試終了</h2>
<div class="score" id="resultPercent">0%</div>
<div style="color:#777">自己採点結果</div>
<div class="resultgrid">
<div class="resultitem"><div class="num" id="rCorrect">0</div>正解</div>
<div class="resultitem"><div class="num" id="rAlmost">0</div>惜しい</div>
<div class="resultitem"><div class="num" id="rWrong">0</div>不正解</div>
</div>
<button class="primary full" id="resumeWrong">間違えた問題を復習</button>
<button class="secondary full" id="restart">この模試を最初から</button>
<button class="secondary full" id="resultHome">模試一覧へ</button>
</div>
</section>
</div>

const STORAGE="sekispe_udemy_v1";
let data=JSON.parse(localStorage.getItem(STORAGE)||'{"mocks":{},"lastMock":1}');
let mock=1,index=0,reviewOnly=false;

const $=id=>document.getElementById(id);
function save(){localStorage.setItem(STORAGE,JSON.stringify(data))}
function mockState(m){
 if(!data.mocks[m]) data.mocks[m]={current:0,answers:{},scores:{}};
 return data.mocks[m];
}
function listQuestions(m){
 return questions.filter(q=>q.mock===m && (!reviewOnly || mockState(m).scores[q.no]!==2));
}
function renderMocks(){
 const g=$("mockGrid");g.innerHTML="";
 for(let m=1;m<=5;m++){
  const s=mockState(m), answered=Object.keys(s.scores).length, pct=Math.round(answered/60*100);
  const b=document.createElement("button");b.className="mock";
  b.innerHTML=`<strong>模試 ${m}</strong><span>${answered} / 60問 解答済み</span><div class="mini"><i style="width:${pct}%"></i></div>`;
  b.onclick=()=>startMock(m,false);g.appendChild(b);
 }
 save();
}
function startMock(m,review){
 mock=m;reviewOnly=review;
 const s=mockState(m);
 const qs=listQuestions(m);
 index=review?0:Math.min(s.current,Math.max(qs.length-1,0));
 $("home").classList.add("hidden");$("result").classList.add("hidden");$("exam").classList.remove("hidden");
 render();
}
function render(){
 const qs=listQuestions(mock);
 if(!qs.length){finish();return}
 const x=qs[index],s=mockState(mock), ans=s.answers[x.no]||"", score=s.scores[x.no];
 $("mockTitle").textContent=`模試 ${mock}${reviewOnly?"・復習":""}`;
 $("progressText").textContent=`Q${x.no} / 60`;
 $("progressBar").style.width=(x.no/60*100)+"%";
 $("qid").textContent=`Q${x.no}`;$("tag").textContent=x.tag;
 $("question").textContent=x.q;$("draft").value=ans;
 $("model").textContent=x.a;$("points").innerHTML=x.points.map(p=>`<li>${p}</li>`).join("");
 $("answer").classList.remove("show");
 $("status").textContent=score===undefined?"未採点":score===2?"🟢 正解":score===1?"🟡 惜しい":"🔴 不正解";
}
$("draft").addEventListener("input",e=>{
 const s=mockState(mock),qs=listQuestions(mock),x=qs[index];s.answers[x.no]=e.target.value;s.current=x.no;data.lastMock=mock;save();
});
$("reveal").onclick=()=>{$("answer").classList.add("show");window.scrollTo({top:0,behavior:"smooth"})};
document.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{
 const qs=listQuestions(mock),x=qs[index];mockState(mock).scores[x.no]=Number(b.dataset.score);save();render();$("answer").classList.add("show");
});
function next(){
 const qs=listQuestions(mock);
 if(index<qs.length-1){index++;mockState(mock).current=qs[index].no;save();render();window.scrollTo({top:0,behavior:"smooth"})}
 else if(reviewOnly) finish();
 else finish();
}
function prev(){if(index>0){index--;render();window.scrollTo({top:0,behavior:"smooth"})}}
$("next").onclick=next;$("nextTop").onclick=next;$("prev").onclick=prev;
$("backHome").onclick=()=>{renderMocks();$("exam").classList.add("hidden");$("home").classList.remove("hidden")};
function finish(){
 const s=mockState(mock);let c=0,a=0,w=0;
 for(let n=1;n<=60;n++){if(s.scores[n]===2)c++;else if(s.scores[n]===1)a++;else if(s.scores[n]===0)w++}
 $("exam").classList.add("hidden");$("result").classList.remove("hidden");
 $("resultTitle").textContent=`模試 ${mock} 終了`;
 $("resultPercent").textContent=Math.round(c/60*100)+"%";
 $("rCorrect").textContent=c;$("rAlmost").textContent=a;$("rWrong").textContent=w;
}
$("resumeWrong").onclick=()=>startMock(mock,true);
$("restart").onclick=()=>{
 data.mocks[mock]={current:0,answers:{},scores:{}};save();startMock(mock,false)
};
$("resultHome").onclick=()=>{$("result").classList.add("hidden");$("home").classList.remove("hidden");renderMocks()};
renderMocks();
</script>
</body>
</html>
