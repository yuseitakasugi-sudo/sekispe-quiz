<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>セキスペ午後模試</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:720px;min-height:100vh;margin:auto;padding:18px 14px 28px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.title{font-weight:800;font-size:20px}.sub{font-size:12px;color:#777;margin-top:3px}
.progressbox{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.05);margin-bottom:14px}
.progressrow{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:9px}
.bar{height:7px;background:#e9e9e9;border-radius:99px;overflow:hidden}.barin{height:100%;background:#111;border-radius:99px;transition:.2s}
.card{background:#fff;border-radius:20px;padding:22px 20px;box-shadow:0 3px 16px rgba(0,0,0,.07);flex:1}
.badge{display:inline-block;background:#eef2ff;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}.tag{color:#666;font-size:13px;margin-left:8px}
.question{font-size:20px;line-height:1.8;font-weight:600;margin:23px 0}
textarea{width:100%;min-height:170px;border:1px solid #ddd;border-radius:14px;padding:14px;font-size:17px;line-height:1.6;resize:none;outline:none}
textarea:focus{border-color:#777}
.autosave{font-size:11px;color:#888;margin-top:7px}
button{width:100%;border:0;border-radius:13px;padding:14px;font-size:16px;font-weight:700;margin-top:12px}
.primary{background:#111;color:#fff}.secondary{background:#eee;color:#111}
.answer{display:none;border-top:1px solid #eee;margin-top:20px;padding-top:18px;line-height:1.75}
.answer.show{display:block}.label{font-size:13px;color:#666;font-weight:700}.model{font-size:16px;margin:6px 0 14px}
.points{background:#f7f7f7;border-radius:12px;padding:12px 16px}
.points li{margin:5px 0}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choices button{margin-top:8px;font-size:14px}.green{background:#e8f6ec;color:#17652c}.yellow{background:#fff3cf;color:#735500}.red{background:#fdeaea;color:#8a2222}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.nav button{margin:0}.status{text-align:center;font-size:12px;color:#777;margin-top:12px}
.hidden{display:none!important}.result{text-align:center}.big{font-size:42px;font-weight:800;margin:12px}.resultgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0}.resultitem{background:#f7f7f7;border-radius:12px;padding:14px}.resultnum{font-size:22px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div><div class="title">セキスペ午後模試</div><div class="sub">一問ずつ集中して解く</div></div>
</header>

<div class="progressbox">
<div class="progressrow"><span id="count">Q1 / 5</span><span id="percent">0%</span></div>
<div class="bar"><div class="barin" id="bar"></div></div>
</div>

<main class="card" id="quizCard">
<div><span class="badge" id="qid">Q1</span><span class="tag" id="tag">SBOM</span></div>
<div class="question" id="question"></div>
<textarea id="draft" placeholder="あなたの答案を書いてください"></textarea>
<div class="autosave">入力内容は自動保存されます</div>
<button class="primary" id="reveal">回答を見る</button>

<div class="answer" id="answer">
<div class="label">模範解答</div>
<div class="model" id="model"></div>
<div class="label">採点ポイント</div>
<ul class="points" id="points"></ul>
<div class="label">自己採点</div>
<div class="choices">
<button class="green" data-score="2">🟢 正解</button>
<button class="yellow" data-score="1">🟡 惜しい</button>
<button class="red" data-score="0">🔴 不正解</button>
</div>
<button class="primary" id="next">次の問題 →</button>
</div>

<div class="nav">
<button class="secondary" id="prev">← 前の問題</button>
<button class="secondary" id="nextTop">次の問題 →</button>
</div>
<div class="status" id="status"></div>
</main>

<main class="card result hidden" id="resultCard">
<h2>模試終了</h2>
<div class="big" id="resultPercent">0%</div>
<div class="muted">自己採点結果</div>
<div class="resultgrid">
<div class="resultitem"><div class="resultnum" id="rCorrect">0</div>正解</div>
<div class="resultitem"><div class="resultnum" id="rAlmost">0</div>惜しい</div>
<div class="resultitem"><div class="resultnum" id="rWrong">0</div>不正解</div>
</div>
<button class="primary" id="restart">最初から解き直す</button>
</main>
</div>

<script>
const questions=[
{id:1,tag:"SBOM",q:"脆弱性が公表された際、SBOMを利用すると何が容易になるか。",a:"利用しているソフトウェアやそのバージョンを明確にし、脆弱性の影響有無を容易に把握できる。",p:["利用ソフトウェアの把握","バージョンの把握","脆弱性の影響有無の把握"]},
{id:2,tag:"SAST / DAST / IAST",q:"SAST、DAST、IASTの違いを簡潔に説明せよ。",a:"SASTはソースコード等を解析、DASTは稼働中のアプリを外部から検査、IASTはアプリ内部の実行情報を利用して検査する。",p:["SAST＝静的解析","DAST＝動的・外部から検査","IAST＝実行時の内部情報を利用"]},
{id:3,tag:"サプライチェーン",q:"委託先がさらに別会社へ再委託する場合、再委託先にもどのようなセキュリティ対策を求めるべきか。",a:"元の委託先に要求しているものと同等のセキュリティ対策を、再委託先にも要求させる。",p:["再委託先にも要求を適用","同等水準のセキュリティ対策","再委託先を管理対象にする"]},
{id:4,tag:"セキュア開発",q:"開発工程の早い段階からセキュリティ対策を組み込む狙いは何か。",a:"後工程での手戻りや脆弱性の作り込みを減らし、早期に問題を発見・修正する。",p:["早期に対策","手戻り削減","脆弱性の早期発見・修正"]},
{id:5,tag:"CVSS",q:"CVSSのAttack Complexity（AC）は何を評価する指標か。",a:"脆弱性を悪用するために必要となる攻撃条件の複雑さを評価する。",p:["悪用条件","攻撃の複雑さ"]}
];

const stateKey="sekispe_exam_v2";
let state=JSON.parse(localStorage.getItem(stateKey)||'{"current":0,"answers":{},"scores":{}}');
let current=Math.min(Math.max(Number(state.current)||0,0),questions.length-1);

const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(stateKey,JSON.stringify(state));}
function render(){
 const x=questions[current], ans=state.answers[x.id]||"", score=state.scores[x.id];
 $("count").textContent=`Q${current+1} / ${questions.length}`;
 $("percent").textContent=Math.round(current/questions.length*100)+"%";
 $("bar").style.width=(current/questions.length*100)+"%";
 $("qid").textContent="Q"+x.id; $("tag").textContent=x.tag; $("question").textContent=x.q;
 $("draft").value=ans;
 $("model").textContent=x.a;
 $("points").innerHTML=x.p.map(v=>`<li>${v}</li>`).join("");
 $("answer").classList.remove("show");
 $("status").textContent=score!==undefined?`この問題の自己採点：${score===2?"🟢 正解":score===1?"🟡 惜しい":"🔴 不正解"}`:"未採点";
}
$("draft").addEventListener("input",e=>{state.answers[questions[current].id]=e.target.value;persist();});
$("reveal").onclick=()=>{$("answer").classList.add("show");window.scrollTo({top:0,behavior:"smooth"});};
document.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{
 state.scores[questions[current].id]=Number(b.dataset.score);persist();render();
 $("answer").classList.add("show");
});
function goNext(){if(current<questions.length-1){current++;state.current=current;persist();render();window.scrollTo({top:0,behavior:"smooth"});}else finish();}
function goPrev(){if(current>0){current--;state.current=current;persist();render();window.scrollTo({top:0,behavior:"smooth"});}}
$("next").onclick=goNext;$("nextTop").onclick=goNext;$("prev").onclick=goPrev;
function finish(){
 let c=0,a=0,w=0;
 questions.forEach(q=>{if(state.scores[q.id]===2)c++;else if(state.scores[q.id]===1)a++;else if(state.scores[q.id]===0)w++;});
 $("quizCard").classList.add("hidden");$("resultCard").classList.remove("hidden");
 $("resultPercent").textContent=Math.round(c/questions.length*100)+"%";
 $("rCorrect").textContent=c;$("rAlmost").textContent=a;$("rWrong").textContent=w;
}
$("restart").onclick=()=>{state={current:0,answers:{},scores:{}};persist();current=0;$("resultCard").classList.add("hidden");$("quizCard").classList.remove("hidden");render();};
render();
</script>
</body>
</html>
